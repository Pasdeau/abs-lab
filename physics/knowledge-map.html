<!DOCTYPE html>
<!-- 网站公开版：由 tools/sync-maps.py 从项目里的导图生成（已去掉个人考试信息）。要改内容请改原始导图后重新同步，不要直接改这个文件。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初中物理知识体系 · 第十七章 欧姆定律（样板）</title>
<style>
:root{
  --ink:#17233a; --ink-2:#47556b; --ink-3:#6b7a90;
  --pen:#1f4e8c; --pen-soft:#e6edf7; --subj:#1f4e8c;
  --paper:#f3f6f9; --sheet:#ffffff; --rule:#d8e0ea; --grid:#e3eaf3;
  --t5:#b42318; --t4:#c2410c; --t3:#1d4ed8; --t2:#64748b;
  --weak:#9f1239; --ok:#15803d;
  --hs:#6b46c1; --hs-bg:#f3eefc; --hs-rule:#d9cdf3;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --math:"Times New Roman","Cambria Math","STIX Two Math","Noto Serif",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:160px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.8}
a{color:var(--pen)}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;line-height:1.35;color:var(--ink)}
p{margin:.4em 0 .8em}

/* 数学排版：量用斜体，单位和数字用正体 */
.m{font-family:var(--math);white-space:nowrap;font-size:1.06em}
.m i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 .2em}
.frac>span:last-child{padding:0 .2em}
.m-big{font-size:1.5em}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--rule)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 20px}
.brand{font-family:var(--serif);font-weight:700;font-size:18px;margin-right:auto}
.brand small{font-family:var(--sans);font-weight:400;color:var(--ink-3);font-size:14px;margin-left:8px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:15px}
.tools input[type=search]{font:inherit;font-size:15px;padding:5px 10px;border:1px solid var(--rule);border-radius:6px;width:15em}
.tools select{font:inherit;font-size:15px;padding:4px 6px;border:1px solid var(--rule);border-radius:6px;background:#fff}
.tools label{white-space:nowrap}
.hs-switch{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--hs-rule);border-radius:20px;background:var(--hs-bg);color:var(--hs)}
.btn{font:inherit;font-size:14px;padding:4px 10px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--pen)}
.status{font-size:14px;color:var(--ink-3)}

/* 版式 */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding:24px 20px 80px}
.sidenav{position:sticky;top:160px;align-self:start;max-height:calc(100vh - 180px);overflow:auto;font-size:15px}
.sidenav h2{font-size:15px;margin:0 0 6px;color:var(--ink-2)}
.sidenav ol,.sidenav ul{list-style:none;margin:0 0 18px;padding:0}
.sidenav li{margin:2px 0}
.sidenav a{display:block;padding:3px 8px;border-radius:5px;text-decoration:none;color:var(--ink)}
.sidenav a:hover{background:var(--pen-soft)}
.sidenav .off{display:block;padding:3px 8px;color:var(--ink-3)}
.sidenav .cur{background:var(--pen-soft);color:var(--pen);font-weight:600}
.chlist>summary{cursor:pointer;list-style:none}
.chlist>summary::-webkit-details-marker{display:none}
.chlist>summary h2{display:inline}
.chlist>summary::after{content:'（展开）';font-size:13px;color:var(--ink-3)}
.chlist[open]>summary::after{content:''}
main{min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:32px 40px;margin-bottom:28px}
.sheet>h2{font-size:24px;margin:0 0 14px}
section.part{margin-top:44px}
section.part:first-of-type{margin-top:8px}
.part>h3{font-size:21px;margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.lead{color:var(--ink-2)}
.note{font-size:15px;color:var(--ink-2)}
.tag{display:inline-block;font-size:13px;line-height:1.5;padding:0 7px;border-radius:4px;border:1px solid currentColor;margin-right:4px;white-space:nowrap}
.tag.pend{color:#92400e;background:#fffbeb}

/* 第十七章题头：电路图就是这一章的封面 */
.ch-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:center;
  background-color:#fbfdff;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;border:1px solid var(--rule);border-radius:4px;padding:28px 32px;margin:-8px 0 8px}
.ch-hero h2{font-size:34px;margin:0 0 4px;letter-spacing:.04em}
.ch-hero .book{color:var(--ink-3);font-size:15px}
.ch-hero .law{font-family:var(--math);font-size:44px;color:var(--pen);margin:14px 0 6px}
.ch-hero .law .frac>span:first-child{border-bottom-width:2px}
.ch-hero p{margin:0;color:var(--ink-2)}
.ch-hero svg{width:100%;height:auto}

/* 导图 */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:14px;padding-left:16px;border-left:1px solid var(--rule)}
.tree li{position:relative;margin:3px 0}
.tree ul>li::before{content:"";position:absolute;left:-16px;top:.95em;width:12px;border-top:1px solid var(--rule)}
.tree summary{cursor:pointer;list-style:none}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"＋";display:inline-block;width:1.3em;color:var(--pen);font-weight:700}
.tree details[open]>summary::before{content:"－"}
.tree .leaf::before{content:"";display:inline-block;width:1.3em}
.tree .board{font-family:var(--serif);font-weight:700;font-size:18px}
.tree .chap{font-weight:600}
.tree .chap.ready{color:var(--pen)}
.tree .yrs{font-size:13px;color:var(--ink-3);margin-left:6px}
.tree .soon{font-size:13px;color:var(--ink-3);margin-left:6px}
.tree a{text-decoration:none}
.tree a:hover{text-decoration:underline}
.map-root{font-family:var(--serif);font-weight:700;font-size:18px}

/* 考频与星级 */
.tier{font-weight:600}
.tier[data-t="必考"]{color:var(--t5)} .tier[data-t="高频"]{color:var(--t4)}
.tier[data-t="中频"]{color:var(--t3)} .tier[data-t="低频"]{color:var(--t2)}
.stars{color:#b7791f;letter-spacing:1px;white-space:nowrap}
.stars .off{color:#d6dbe2}
.weak{color:var(--weak)}

/* 知识点：不用卡片阴影，用左侧色条标考频 */
.kp{position:relative;border-top:1px solid var(--rule);padding:22px 0 18px 20px}
.kp::before{content:"";position:absolute;left:0;top:24px;bottom:20px;width:4px;border-radius:2px;background:var(--t2)}
.kp[data-tier="必考"]::before{background:var(--t5)} .kp[data-tier="高频"]::before{background:var(--t4)}
.kp[data-tier="中频"]::before{background:var(--t3)}
.kp-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.kp-head h4{font-size:20px;margin:0}
.kp-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:15px;color:var(--ink-2);margin:6px 0 8px}
.kp .core{margin:6px 0 10px;max-width:42em}
.status-pick{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--ink-2)}
.status-pick select{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--rule);border-radius:14px;background:#fff;color:var(--ink)}
.st{display:inline-block;font-family:var(--sans);font-weight:400;font-size:13px;line-height:1.5;border:1px solid currentColor;border-radius:4px;padding:0 6px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.st[data-s="0"]{color:var(--ink-3)}
.st[data-s="1"]{color:#b45309;background:#fffbeb}
.st[data-s="2"]{color:#1d4ed8;background:#eef4ff}
.st[data-s="3"]{color:var(--ok);background:#f0fdf4}
.tree .st[data-s="0"]{display:none}
dialog.names{border:1px solid var(--rule);border-radius:6px;padding:20px 24px;max-width:26em}
dialog.names::backdrop{background:rgba(23,35,58,.35)}
dialog.names h2{font-size:19px;margin:0 0 6px}
dialog.names label{display:flex;align-items:center;gap:10px;margin:8px 0}
dialog.names input{font:inherit;font-size:16px;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;width:9em}
dialog.names .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.facts{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:4px 14px;font-size:15.5px;margin:8px 0;max-width:46em}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0}
.facts ul{margin:0;padding-left:1.1em}
.facts li{margin:2px 0}
.yr{font-family:var(--math);font-weight:700;color:var(--ink);margin-right:4px}
.pitfall{border-left:3px solid var(--weak);background:#fff5f7;padding:8px 14px;margin:10px 0 4px;font-size:16px;max-width:44em}
.pitfall b{color:var(--weak)}
details.ex{margin:10px 0;max-width:44em}
details.ex>summary{cursor:pointer;color:var(--pen);font-weight:600}
details.ex .ex-body{border:1px dashed var(--rule);border-radius:4px;padding:10px 16px;margin-top:6px;background:#fbfcfe}
.ex-body ol{margin:.3em 0;padding-left:1.4em}
.empty{display:none;color:var(--ink-3);padding:16px 0}

/* 表格 */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px;margin:8px 0 6px}
th,td{border:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:top}
th{background:#f1f5f9;font-weight:600}
td.c{text-align:center}
caption{caption-side:bottom;text-align:left;font-size:14px;color:var(--ink-3);padding-top:4px}

/* 实验 */
.exp{border-top:1px solid var(--rule);padding:18px 0}
.exp h4{font-size:19px;margin:0 0 4px}
.exp-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.exp-grid svg{width:100%;height:auto;border:1px solid var(--rule);background:#fbfdff}
.ftbl td:first-child{white-space:nowrap}
.ftbl .unit{white-space:nowrap}
.exp dl{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:6px 14px;font-size:15.5px;margin:8px 0}
.exp dt{color:var(--ink-3)} .exp dd{margin:0}
.exp ol,.exp ul{margin:0;padding-left:1.3em}

/* 高中衔接：另一种底色，默认隐藏 */
.bridge{display:none;background:var(--hs-bg);border:1px solid var(--hs-rule);border-left:5px solid var(--hs);border-radius:4px;padding:18px 22px;margin-top:44px}
body.show-hs .bridge{display:block}
.bridge h3{color:var(--hs);font-size:20px;margin:0 0 4px;border:0}
.bridge .b-item{border-top:1px solid var(--hs-rule);padding:12px 0 6px}
.bridge .b-item:first-of-type{border-top:0}
.bridge dl{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:4px 12px;margin:4px 0;font-size:15.5px}
.bridge dt{color:var(--hs)} .bridge dd{margin:0}
.fix{font-size:13px;color:#fff;background:var(--hs);border-radius:4px;padding:0 6px;margin-left:6px}
.hs-hint{font-size:15px;color:var(--hs)}
body.show-hs .hs-hint{display:none}

/* 知识地图（图形版导图） */
.atlas{max-width:1880px;margin:22px auto 0;padding:0 20px}
.atlas-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;margin-bottom:10px}
.atlas-head h2{font-size:28px;margin:0;letter-spacing:.04em}
.atlas-head p{margin:0;color:var(--ink-2);font-size:15.5px}
.mm-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 8px}
.mm-hint{font-size:14px;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-right:6px}
.seg button{font:inherit;font-size:14px;border:0;background:#fff;padding:4px 12px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--pen);color:#fff}
.mm-stage{border:1px solid var(--rule);border-radius:4px;background:#fbfdff;overflow:hidden;touch-action:pan-x pan-y}
.mm.zoomed .mm-stage{cursor:grab;touch-action:none}
.mm.dragging .mm-stage{cursor:grabbing}
.mm-stage svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.mm-stage a{cursor:pointer}
.mm-stage a:hover text{text-decoration:underline}
.mm-stage a:focus-visible{outline:3px solid #f59e0b}
.mm-focus .mm-g{opacity:.14;transition:opacity .15s}
.mm-focus .mm-g.on{opacity:1}
@media (prefers-reduced-motion:reduce){.mm-focus .mm-g{transition:none}}
.mm-full{position:fixed;inset:0;z-index:60;background:#fff;padding:10px 14px;display:flex;flex-direction:column}
.mm-full .mm-stage{flex:1;min-height:0}
.mm-full .mm-stage svg{height:100%}
html.mm-lock{overflow:hidden}
#ch17mm{margin:6px 0 4px}
.mm-zoom{display:inline-flex;flex-wrap:wrap;gap:6px 8px}
.mm.is-list .map-only,.mm.is-list .mm-stage{display:none}
.mm:not(.is-list) .vm-stage{display:none}
.mm-node[data-bb]{cursor:zoom-in}
/* 竖版（手机）：同样的颜色、圆点和小圆饼，从上往下排成一棵树 */
.vmap{font-size:16px;line-height:1.5}
.vm-root{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:4px 12px;width:max-content;max-width:100%;margin:4px auto 16px;padding:8px 22px;border:2px solid var(--ink);border-radius:28px;background:#fff}
.vm-root b{font-family:var(--serif);font-size:24px}
.vm-root span,.vm-root small{font-size:14px;color:var(--ink-3);letter-spacing:.2em}
.vm-root.ch{flex-direction:column;align-items:center;gap:0;border-radius:16px;padding:8px 28px}
.vm-root .law{font-family:var(--math);font-size:22px;color:var(--pen);letter-spacing:0}
.vm-board{background:var(--t);border:1.5px solid var(--tb);border-radius:18px;padding:12px 8px 10px 10px;margin:0 0 14px}
.vm-bhead{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:22px;background:var(--c);color:#fff;font:700 20px/1.4 var(--serif);padding:5px 16px 5px 9px;cursor:pointer}
.vm-bhead small{font:400 13px var(--sans);opacity:.9}
.vm-bhead::after{content:"";width:7px;height:7px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);margin:-4px 0 0 2px}
.vm-bhead[aria-expanded="false"]::after{transform:rotate(-45deg);margin:0}
.vm-icon{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vm-chaps{list-style:none;margin:0 0 0 20px;padding:0}
.vm-chap{position:relative;padding:6px 0 0 22px}
.vm-chap::before{content:"";position:absolute;left:0;top:0;width:18px;height:28px;border-left:3px solid var(--c);border-bottom:3px solid var(--c);border-bottom-left-radius:14px}
.vm-chap::after{content:"";position:absolute;left:0;top:22px;bottom:0;border-left:3px solid var(--c)}
.vm-chap:last-child::after{display:none}
.vm-crow{display:flex;align-items:center;gap:6px;min-height:44px}
.vm-cname{display:inline-flex;align-items:center;gap:8px;min-width:0;min-height:40px;background:#fff;border:1.5px solid var(--c);border-radius:22px;padding:3px 14px 3px 4px;color:var(--ink);text-decoration:none;font:700 17px/1.3 var(--serif)}
.vm-chap.ready>.vm-crow .vm-cname{background:var(--tp);border-width:2.2px}
.vm-badge{width:32px;height:32px;flex:none}
.vm-badge text{font-family:var(--sans)}
.vm-dots{display:inline-flex;align-items:center;gap:3px;flex:none}
.vm-dots i{width:7px;height:7px;border-radius:50%;border:1.2px solid #c3ccd8;background:#fff}
.vm-dots i.on{background:var(--c);border-color:var(--c)}
.vm-dots b{color:var(--c,var(--ink-2));font-size:13px;margin-left:3px;white-space:nowrap}
.vm-tog{flex:none;margin-left:auto;width:40px;height:40px;border:0;border-radius:50%;background:transparent;cursor:pointer;position:relative}
.vm-tog::before{content:"";position:absolute;left:15px;top:13px;width:8px;height:8px;border-right:2.4px solid var(--c);border-bottom:2.4px solid var(--c);transform:rotate(45deg)}
.vm-tog[aria-expanded="false"]::before{transform:rotate(-45deg);left:13px;top:16px}
.vm-secs{list-style:none;margin:2px 0 6px 19px;padding:0}
.vm-secs>li{position:relative;padding:2px 0 2px 18px}
.vm-secs>li::before{content:"";position:absolute;left:0;top:0;width:13px;height:19px;border-left:1.6px solid var(--l);border-bottom:1.6px solid var(--l);border-bottom-left-radius:9px}
.vm-secs>li::after{content:"";position:absolute;left:0;top:16px;bottom:0;border-left:1.6px solid var(--l)}
.vm-secs>li:last-child::after{display:none}
.vm-secs a{display:inline-block;padding:4px 0 2px;color:var(--ink-2);text-decoration:none;font-size:15.5px;border-bottom:1.6px solid var(--l)}
.vm-chap.ready .vm-secs a{color:var(--ink)}
.vm-prac{font-size:12px;font-weight:700;color:var(--c);background:var(--tp);border-radius:3px;padding:0 4px;margin-right:6px}
.vm-kps{list-style:none;margin:2px 0 4px 4px;padding:0}
.vm-kps a{display:flex;align-items:center;gap:7px;border:0;font-size:15px;padding:3px 0}
.vm-pie{width:16px;height:16px;flex:none;vertical-align:-3px}
.vm-sname{display:inline-flex;align-items:center;gap:9px;min-height:40px;background:var(--c);color:#fff;border-radius:20px;padding:5px 16px 5px 6px;text-decoration:none;font-weight:700;font-size:16px;line-height:1.35}
.vm-sno{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--c);font-size:13.5px;flex:none}
.vm-kplist{margin-left:16px}
.vm-kplist>li::before{height:22px}
.vm-kp{display:block!important;padding:5px 0 6px!important;color:var(--ink)!important}
.vm-kn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}
.vm-tbar{display:inline-block;width:4px;height:18px;border-radius:2px;flex:none}
.vm-km{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:13.5px;margin:2px 0 0 12px;font-weight:600}
.vm-weak{color:var(--weak);border:1px solid var(--weak);background:#fff1f3;border-radius:4px;padding:0 6px;font-size:12.5px;font-weight:400}
.vm-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink-2);margin:4px 4px 2px}
.vm-legend>span{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px}
/* 文字版目录：分节标题、跳转后的提示 */
.sec-h{display:flex;align-items:center;gap:10px;font-size:18px;margin:30px 0 2px;color:var(--ink)}
.sec-h .no{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pen);color:#fff;font:700 13.5px var(--sans);flex:none}
@keyframes flash{0%{background-color:#fff1b8}100%{background-color:transparent}}
.flash{animation:flash 1.8s ease-out}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid #f59e0b;outline-offset:2px}}
.sidenav .off-link{color:var(--ink-3)}
/* 使用指南 */
.guide-btn{border-color:var(--pen);color:var(--pen);font-weight:600}
dialog.guide{width:min(780px,calc(100vw - 24px));max-height:min(88vh,780px);padding:0;border:1px solid var(--rule);border-radius:10px;color:var(--ink)}
dialog.guide[open]{display:flex;flex-direction:column}
dialog.guide::backdrop{background:rgba(23,35,58,.4)}
.g-head{display:flex;align-items:center;gap:12px;padding:14px 14px 6px 22px}
.g-head h2{margin:0;font-size:22px;margin-right:auto}
.g-x{border:0;background:none;font-size:28px;line-height:1;width:40px;height:40px;border-radius:50%;color:var(--ink-3);cursor:pointer}

/* ===== 物理页面风格：实验台（仪表面板） =====
   颜色规则（四科统一）：学科主色（物理为蓝）只用于大面积底色、题头和标题；
   考频、学习状态等小标记四科用同一套颜色，并且都配文字。 */
:root{--alu1:#f5f7f9;--alu2:#d7dde4;--bake:#1d2127;--panel:#f8f9fb;--screw:#8a94a1}
body{background-color:#e5e9ee;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px 4px)}
.topbar{background:linear-gradient(#fbfcfd,#eef1f4);border-bottom:1px solid #c3cbd5}
.brand{color:var(--subj)}
.sheet{background:var(--panel);border:1px solid #c3cbd5;border-radius:12px;position:relative}
.sheet::before,.sheet::after{content:"";position:absolute;top:12px;width:10px;height:10px;border-radius:50%;
  background:linear-gradient(135deg,transparent 42%,#5f6873 42% 58%,transparent 58%),radial-gradient(circle,#c7ced6 0 4px,#8a94a1 4.5px 5px)}
.sheet::before{left:12px}.sheet::after{right:12px}
.sheet>h2,.atlas-head h2{color:var(--subj)}
.mm-stage{border-color:#b8c1cc;border-radius:8px}
/* 大标题：A 方案的「图 17-n」编号 + 蓝色标牌 */
.part>h3{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;border:0;padding:0;margin:0 0 14px;font-size:20px}
.part>h3 .code{font:600 13.5px var(--sans);color:var(--subj);background:#fff;border:1.5px solid var(--subj);border-radius:3px;padding:1px 8px;letter-spacing:.04em}
.part>h3 .plt{background:var(--subj);color:#fff;padding:4px 16px 5px;border-radius:5px;letter-spacing:.03em}
.sec-h .no{background:var(--subj)}
/* 题头：铝板 + 两只指针式电表 */
.ch-hero{background:linear-gradient(160deg,var(--alu1),var(--alu2));border:1px solid #b8c1cc;border-radius:10px}
.ch-hero h2,.ch-hero .law{color:var(--subj)}
.meters-hero{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:6px}
.ch-hero .meters-hero svg.dial{width:160px}
.meters-hero .cap{width:100%;text-align:center;font-size:14.5px;color:var(--ink-2)}
/* 知识点卡片：面板，左上角指示灯表示考频（旁边一行有文字） */
.kp{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:20px 20px 16px 32px;margin:14px 0}
.kp::before{left:12px;top:29px;bottom:auto;width:10px;height:10px;border-radius:50%;background:var(--t2);color:var(--t2);box-shadow:0 0 0 3px rgba(0,0,0,.05),0 0 7px 1px currentColor}
.kp[data-tier="必考"]::before{background:var(--t5);color:var(--t5)} .kp[data-tier="高频"]::before{background:var(--t4);color:var(--t4)}
.kp[data-tier="中频"]::before{background:var(--t3);color:var(--t3)}
.dial{width:150px;height:auto;display:block}
/* 公式铭牌 */
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:8px 0 10px}
.plate{position:relative;color:var(--bake);border:1px solid #aab3be;border-radius:8px;padding:16px 18px 14px;
  background:radial-gradient(circle at 11px 11px,#7d8794 2.5px,#eef1f4 3px,transparent 4px),radial-gradient(circle at calc(100% - 11px) 11px,#7d8794 2.5px,#eef1f4 3px,transparent 4px),radial-gradient(circle at 11px calc(100% - 11px),#7d8794 2.5px,#eef1f4 3px,transparent 4px),radial-gradient(circle at calc(100% - 11px) calc(100% - 11px),#7d8794 2.5px,#eef1f4 3px,transparent 4px),repeating-linear-gradient(0deg,rgba(255,255,255,.5) 0 1px,transparent 1px 3px),linear-gradient(#f3f5f7,#d9dee4)}
.plate .pl-k{display:inline-block;background:var(--subj);color:#fff;font-size:12.5px;padding:0 8px;border-radius:3px;letter-spacing:.06em}
.plate .pl-name{font-weight:800;font-size:18px;margin:6px 0 2px;text-shadow:0 1px 0 #fff}
.plate .pl-f{font-family:var(--math);font-size:27px;color:var(--subj);margin:2px 0 10px;text-shadow:0 1px 0 #fff;overflow-x:auto}
.plate .pl-f.plain{font-family:var(--sans);font-size:18px;font-weight:700}
.plate dl{display:grid;grid-template-columns:4.8em minmax(0,1fr);gap:4px 10px;margin:0;padding-top:8px;border-top:1px solid #aab3be;font-size:14.5px;line-height:1.6}
.plate dt{color:#5c6672} .plate dd{margin:0}
.mnem,.orig{display:inline-block;font-size:12.5px;line-height:1.5;border-radius:3px;padding:0 6px;white-space:nowrap;vertical-align:1px;font-weight:400}
.mnem{color:#47556b;background:#fff;border:1px dashed #8a94a1}
.orig{color:#5b3e00;background:#fff4d6;border:1px solid #e3c36b}
/* 生活中的物理 */
.life{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:14px 16px;margin:14px 0;max-width:46em;background:#fffdf5;border:1px solid #e3d9b8;border-radius:8px}
.life svg{width:100%;height:auto}
.life .lk,.cv-k,.flow-k,.analog .ak,.sim-tag{display:inline-block;font-size:13px;padding:0 8px;border-radius:3px;letter-spacing:.06em;font-weight:600}
.life .lk{background:var(--bake);color:#ffe9a8}
.life h5{font-size:17px;margin:4px 0 6px}
.life ol{margin:0;padding-left:1.4em;font-size:15.5px}
.life li{margin:3px 0}
.life li b{margin-right:6px}
/* 陷阱卡（与「易错提醒」同一色系） */
.trap{padding:12px 16px;margin:14px 0;max-width:46em;background:#fff;border:1px solid var(--rule);border-left:6px solid var(--weak);border-radius:8px}
.trap-k{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--weak);margin-bottom:2px}
.trap-k i{width:11px;height:11px;border-radius:50%;background:var(--weak);box-shadow:0 0 7px 2px rgba(159,18,57,.4)}
.trap-row{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:10px;padding:6px 0;font-size:15.5px}
.trap-row+.trap-row{border-top:1px solid #eceff3}
.trap-row b{color:#5c6672}
.trap-row p{margin:0}
.trap-row.wrong p{color:#7a1022}
.trap-row.right b{color:var(--ok)}
/* 类比卡 */
.analog{margin:14px 0;max-width:46em;border:1px solid #c9d3df;border-radius:8px;background:#f6f9fc;padding:12px 16px}
.analog .ak{background:var(--subj);color:#fff}
.analog table{margin:8px 0;font-size:15px;background:#fff}
.analog h5{font-size:15.5px;margin:10px 0 2px;color:var(--weak)}
.analog ol{margin:0;padding-left:1.4em;font-size:15.5px}
/* 实验设计三问 */
.cv{margin:14px 0;max-width:46em;border:1px solid #c9d3df;border-radius:8px;background:#fff;padding:12px 16px}
.cv-k{background:var(--bake);color:#f1f3f6}
.cv-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.cv-tabs button{font:inherit;font-size:14.5px;border:1px solid var(--rule);background:#fff;border-radius:16px;padding:3px 14px;cursor:pointer;color:var(--ink-2)}
.cv-tabs button[aria-selected="true"]{background:var(--subj);border-color:var(--subj);color:#fff}
.cv dl{display:grid;grid-template-columns:7em minmax(0,1fr);gap:4px 12px;margin:0;font-size:15.5px}
.cv dt{color:var(--ink-3)} .cv dd{margin:0}
/* 故障两步判断 */
.flow{margin:14px 0;max-width:46em;border:1px solid #c9d3df;border-radius:8px;background:linear-gradient(160deg,var(--alu1),#e3e8ee);padding:12px 16px}
.flow-k{background:var(--bake);color:#f1f3f6}
.flow-q{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:10px 0 0;font-size:15.5px}
.flow-q .btn{font-size:14.5px}
.btn[aria-pressed="true"]{background:var(--subj);border-color:var(--subj);color:#fff}
.flow-r{margin-top:10px;font-size:15.5px;background:#fff;border-radius:6px;padding:8px 12px;border:1px solid var(--rule)}
.flow-r:empty{display:none}
/* 交互模拟 */
.sim{margin:16px 0;max-width:52em;padding:12px 14px 14px;background:linear-gradient(160deg,var(--alu1),var(--alu2));border:1px solid #b8c1cc;border-radius:10px}
.sim-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-bottom:8px}
.sim-head b{font-size:16.5px}
.sim-tag{background:var(--bake);color:#f1f3f6;margin-left:auto}
.sim-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.sim-cir{width:100%;height:auto;display:block;background:#fff;border-radius:6px;border:1px solid #c9d1da}
.sim label.rng{display:block;font-size:15px;margin:8px 0 2px}
.sim input[type=range]{width:100%;accent-color:var(--subj)}
.sim .meters{display:flex;gap:10px;flex-wrap:nowrap}
.sim .chain{list-style:none;margin:8px 0 0;padding:0;font-size:14.5px}
.sim .chain li{display:flex;align-items:center;gap:8px;padding:2px 0}
.sim .chain .ar{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-weight:700;font-size:14px;background:var(--bake);color:#fff}
.sim .chain .ar.dn{background:#5c6672}
.sim .chain .ar.eq{background:#c9d1da;color:var(--ink)}
.sim-out{font-size:15px;margin-top:8px;background:#fff;border:1px solid #c9d1da;border-radius:6px;padding:8px 12px}
.sim-note{font-size:13.5px;margin:8px 0 0;color:var(--ink-2)}
.sim .tgl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sim .tgl .btn{font-size:14px}
.sim .seg{margin:6px 6px 0 0}
.pn-node{cursor:pointer}
.pn-node:focus{outline:none}.pn-node:focus-visible circle:first-child{stroke:#f59e0b;stroke-width:3}
.analog .a-t,.cv .a-t{display:block;font-size:17px;margin:6px 0 2px}
.analog .a-in{margin:0 0 6px;font-size:15px;color:var(--ink-2)}
.analog table{border-collapse:collapse;width:100%}
.analog th,.analog td{border:1px solid var(--rule);padding:4px 10px;text-align:left;vertical-align:top}
.analog th{background:#eef2f7;font-weight:600}
.cv-pt{display:none}
.sim .tl{font-size:14px;color:var(--ink-2);align-self:center}
.sim .chain li>span{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px}
.sim .chain li b{font-weight:700}
.sim .chain small{color:var(--ink-3);font-size:12.5px}
.sim .chain .hint{color:var(--ink-3)}
.sim .meters>span{display:block;flex:0 1 150px;min-width:0}
.sim .meters .dial{width:100%}
.sim-out .note{display:block;margin-top:4px;font-size:13.5px}
.iu-t{border-collapse:collapse;font-size:14px;margin:0 0 4px}
.iu-t th,.iu-t td{padding:2px 8px;border-bottom:1px solid #e3e8ee;text-align:left;white-space:nowrap}
.flow .f-ctx{margin:8px 0 0;font-size:14.5px;color:var(--ink-2)}
.meters-hero .cap small{color:var(--ink-3);font-size:13px}
.bridge>h3 .code{font:600 13.5px var(--sans);color:var(--hs);background:#fff;border:1.5px solid var(--hs);border-radius:3px;padding:1px 8px;margin-right:10px;vertical-align:3px}
.plate .unit{white-space:nowrap}
.log-t td:last-child{text-align:left}
.g-led{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:0;box-shadow:0 0 5px 1px currentColor}
@media (max-width:620px){.life{grid-template-columns:1fr}.life svg{max-width:84px}.ch-hero .meters-hero svg.dial{width:calc(50% - 8px);max-width:150px}.sim-body{grid-template-columns:1fr}.cv dl,.trap-row{grid-template-columns:1fr}.cv dt,.trap-row b{font-weight:700}}

@media (max-width:980px){

  .toc-fab{display:block;position:fixed;right:14px;bottom:16px;z-index:30;border:0;border-radius:24px;background:var(--ink);color:#fff;font:inherit;font-size:15px;padding:9px 20px;box-shadow:0 4px 14px rgba(23,35,58,.28);cursor:pointer}
  .sidenav{display:none}
  body.toc-open .sidenav{display:block;position:fixed;left:0;right:0;bottom:0;z-index:45;max-height:72vh;overflow:auto;border:0;border-radius:14px 14px 0 0;padding:16px 16px 28px;background:#fff;box-shadow:0 -6px 24px rgba(23,35,58,.2)}
  body.toc-open .toc-mask{display:block;position:fixed;inset:0;z-index:44;background:rgba(23,35,58,.35)}
  body.toc-open .toc-fab{z-index:46}
}
@media (max-width:620px){
  .layout{padding:12px 10px 90px}
  .sheet{padding:18px 14px}
  .sheet>h2{font-size:22px}

  .atlas .mm-stage svg{max-height:178mm}
  #ch17mm{break-inside:avoid}
}

<body>
<script src="../shared/topbar.js" data-root=".." data-page="knowledge-map" data-mode="compact"></script>
<header class="topbar">
  <div class="topbar-in">

  std:{verb:'探究',ref:'3.4.2；必做实验 4.2.12',text:'3.4.2「知道电压、电流和电阻。探究电流与电压、电阻的关系，理解欧姆定律。」4.2.12「探究电流与电压、电阻的关系。」'},
  core:`电压是形成电流的原因，电阻表示导体对电流的阻碍作用，所以电流可能同时跟电压和电阻有关。一个量受两个因素影响，就一次只改一个：先保持电阻不变、改变电压，看电流怎么变；再保持电压不变、换不同的电阻，看电流怎么变。得到两句结论：<b>电阻一定时，通过导体的电流与导体两端的电压成正比；电压一定时，通过导体的电流与导体的电阻成反比。</b>`,
  starWhy:'近 5 年只在 2024 年第 19 题考过 1 次（整题 9 分），按规则为中频、★3；但它是课标必做实验，2027 年起命题以课标为依据，不能放。',
  types:'实验探究',pts:'整道实验题 9 分（2024 年）',
  ex:{q:`电源电压 6 V 保持不变，依次用 5 Ω、10 Ω、20 Ω 的定值电阻探究电流与电阻的关系，每次都让定值电阻两端电压为 2 V。`,
   steps:[`把 5 Ω 换成 10 Ω、滑片不动时，电压表示数怎么变？串联电路中电阻大的分到的电压多，所以示数<b>变大</b>（超过 2 V）。`,
          `要让它回到 2 V，变阻器要多分电压，所以把滑片向<b>使变阻器接入阻值变大</b>的方向移动，眼睛看着电压表。`,
          `用 20 Ω 时，变阻器至少要多大？变阻器两端电压 ${M('6 V − 2 V = 4 V')}，是定值电阻两端电压的 2 倍；串联电流相等，所以变阻器阻值也要是定值电阻的 2 倍，即 <b>40 Ω</b>。`]},
  pitfalls:['结论一定要带前提：「电阻一定时」「电压一定时」。','只能说「电流与电压成正比」，不能倒过来说「电压与电流成正比」——电压是原因，电流是结果。','换电阻前先断开开关；换完后先调滑片让电压表回到原值，再读电流。','不能用小灯泡代替定值电阻做这个实验：灯丝电阻会随温度变。']},

 {id:'k2',name:'欧姆定律',star:5,diff:'中',
  std:{verb:'理解',ref:'3.4.2',text:'3.4.2「……理解欧姆定律。」'},
  core:`导体中的电流，跟导体两端的电压成正比，跟导体的电阻成反比，这就是欧姆定律，写成 ${M(`${v('I')} = ${fr(v('U'),v('R'))}`)}。用它时，三个量必须属于<b>同一个导体、同一时刻</b>。变形 ${M(`${v('U')} = ${v('I')}${v('R')}`)} 和 ${M(`${v('R')} = ${fr(v('U'),v('I'))}`)} 可以求电压和电阻。但 ${M(`${v('R')} = ${fr(v('U'),v('I'))}`)} 只是<b>计算</b>电阻的方法：电阻是导体本身的性质，由材料、长度、横截面积和温度决定，导体两端不加电压时它的电阻依然存在。`,
  starWhy:'课标原文用「理解」的三处之一；近 5 年每年都考。',
  types:'填空、实验探究、综合应用',pts:'填空每空 1 分；在实验题、综合题里是其中一步（分值未逐问取得）',
  ex:{q:'某定值电阻两端电压为 6 V 时，通过它的电流为 0.3 A。',
   steps:[`电阻：${M(`${v('R')} = ${fr(v('U'),v('I'))} = ${fr('6 V','0.3 A')} = 20 Ω`)}。`,
          `电压降为 3 V 时：电阻不变，仍是 20 Ω，${M(`${v('I')} = ${fr('3 V','20 Ω')} = 0.15 A`)}。`,
          `不加电压时，电阻是多少？仍是 20 Ω（不考虑温度变化）。`]},
  pitfalls:['「张冠李戴」：用 R₁ 两端的电压除以 R₂ 的电阻。每代一个数，先问自己「这是哪个电阻的？」','mA 要先换成 A 再代入：1 mA = 0.001 A。']},

 {id:'k3',name:'伏安法测电阻',star:5,diff:'中',
  std:{verb:'会',ref:'3.4.3；必做实验 4.1.9',text:'3.4.3「会使用电流表和电压表。」4.1.9「用电流表和电压表测量电阻。」'},
  core:`电阻不能直接用电表「读」出来，但电压和电流可以测。用电压表测出电阻两端的电压，用电流表测出通过它的电流，再用 ${M(`${v('R')} = ${fr(v('U'),v('I'))}`)} 算出电阻，这就是伏安法。电路里串一个滑动变阻器，一来保护电路，二来改变电阻两端的电压，好多测几组。测<b>定值电阻</b>时，把几次算出的阻值取平均值，可以减小误差。电路图见本章题头和「必做实验」。`,
  starWhy:'近 5 年有 3 年作为实验探究大题出现（2023、2025 测小灯泡电阻，2026 测定值电阻）。',
  types:'实验探究',pts:'整道实验题 7–9 分（2025 年 9 分、2026 年 7 分）',
  ex:{q:'测一个定值电阻，三次读数为：1.5 V、0.10 A；2.0 V、0.13 A；2.5 V、0.16 A。',
   steps:['先分别算每次的电阻：15.0 Ω、约 15.4 Ω、约 15.6 Ω。','再取平均值：(15.0 + 15.4 + 15.6) Ω ÷ 3 ≈ 15.3 Ω。','表格里要有「电阻平均值/Ω」一栏，数据带单位。']},
  pitfalls:['电压表量程按电源电压或额定电压来选；电流要从「+」接线柱流入。','闭合开关前，滑片放在阻值最大处。','读数先看清用的是哪个量程，再数分度值。','测小灯泡电阻时不能求平均值（见下一条）。']},

 {id:'k4',name:'小灯泡的电阻会变',star:3,diff:'中',
  std:{verb:'（无单列条目）',ref:'4.1.9 实验中的现象',text:'课标无单列条目；属必做实验 4.1.9「用电流表和电压表测量电阻」中观察到的现象。'},
  core:`灯丝是金属，灯越亮，灯丝温度越高，电阻越大。电压升高时，电流变大，灯丝更热，电阻也随着变大，所以电流增加得越来越慢。因此小灯泡的 ${M(`${v('I')}–${v('U')}`)} 图像不是过原点的直线，而是一条越来越平的曲线。测小灯泡电阻时，不同电压下的电阻本来就不同，<b>不能求平均值</b>；多测几组，是为了找出电阻随电压（温度）变化的规律。${FIG('iu')}`,
  starWhy:'近 5 年已确认 1 次（2025 年第 19 题第 (4) 问），中频。',
  types:'实验探究（图像分析）',pts:'实验题中的一问（分值未逐问取得）',
  ex:{q:'测小灯泡电阻，得到：1.0 V、0.20 A；2.0 V、0.30 A；2.5 V、0.32 A。',
   steps:['三次电阻分别是 5.0 Ω、约 6.7 Ω、约 7.8 Ω，电压越高电阻越大。','原因：电压越高，灯越亮，灯丝温度越高。','所以不能求三次的平均值，「平均电阻」没有意义。']},
  pitfalls:['读图先看两条坐标轴：横轴是 U 还是 I？同一只灯，I–U 图像和 U–I 图像弯的方向看起来相反。','「图像不是直线的原因」答「灯丝电阻随温度升高而增大」，不要只写「有误差」。']},

 {id:'k5',name:'只用一个电表测电阻',star:2,diff:'难',
  std:{verb:'（无单列条目）',ref:'—',text:'课标无单列条目；新版课本是否收录，待用课本核对 ⓘ。'},
  core:`少一个电表时，用一个阻值已知的电阻 ${v('R','0')} 帮忙。<b>只有电压表</b>：把 ${v('R','0')} 与 ${v('R','x')} 串联，分别测出两者两端的电压；串联电流相等，先求 ${M(`${v('I')} = ${fr(v('U','0'),v('R','0'))}`)}，再求 ${M(`${v('R','x')} = ${fr(v('U','x'),v('I'))}`)}。<b>只有电流表</b>：把 ${v('R','0')} 与 ${v('R','x')} 并联，分别测出两条支路的电流；并联电压相等，先求 ${M(`${v('U')} = ${v('I','0')}${v('R','0')}`)}，再求 ${M(`${v('R','x')} = ${fr(v('U'),v('I','x'))}`)}。`,
  starWhy:'近 5 年已核对的题目中没有考过测电阻的这种方法，低频；2022 年第 19 题用同样思路测小灯泡额定功率（第十八章）。',
  types:'实验探究（方案设计）',pts:'—',
  ex:{q:'只有电压表。R₀ = 10 Ω 与 Rx 串联，测得 R₀ 两端电压 2 V、Rx 两端电压 3 V。',
   steps:[`电流：${M(`${v('I')} = ${fr('2 V','10 Ω')} = 0.2 A`)}。`,`${M(`${v('R','x')} = ${fr('3 V','0.2 A')} = 15 Ω`)}。`]},
  pitfalls:['核心是「借 R₀ 算出缺的那个量」：缺电流表就借 R₀ 算电流，缺电压表就借 R₀ 算电压。','写表达式时，只能用测到的量和 R₀ 表示。']},

 {id:'k6',name:'欧姆定律在串、并联电路中的应用',star:5,diff:'中',
  std:{verb:'理解',ref:'3.4.2；3.4.4',text:'3.4.2「……理解欧姆定律。」3.4.4「……探究并了解串联电路和并联电路中电流、电压的特点。」'},
  core:`<b>串联</b>只有一条路，电流处处相等，总电压被各个电阻「分」掉：${M(`${v('U')} = ${v('U','1')} + ${v('U','2')}`)}。电流相同，电阻大的分到的电压多：${M(`${v('U','1')} : ${v('U','2')} = ${v('R','1')} : ${v('R','2')}`)}。<b>并联</b>各支路两端电压都相等，总电流是各支路电流之和：${M(`${v('I')} = ${v('I','1')} + ${v('I','2')}`)}。电压相同，电阻小的支路电流大：${M(`${v('I','1')} : ${v('I','2')} = ${v('R','2')} : ${v('R','1')}`)}。做题先判断串联还是并联、电表测的是谁，再把欧姆定律用在「同一个电阻」上。${FIG('sp')}`,
  starWhy:'属欧姆定律（课标「理解」级）的应用；近 5 年每年都考。',
  types:'填空、综合应用',pts:'填空每空 1 分；综合题中的计算步骤（分值未逐问取得）',
  ex:{q:'R₁ = 10 Ω、R₂ = 15 Ω 并联在 6 V 电源上。',
   steps:[`并联电压相等，都是 6 V：${M(`${v('I','1')} = ${fr('6 V','10 Ω')} = 0.6 A`)}，${M(`${v('I','2')} = ${fr('6 V','15 Ω')} = 0.4 A`)}。`,
          `干路电流 ${M('0.6 A + 0.4 A = 1.0 A')}。`,
          `检查比例：${M(`${v('I','1')} : ${v('I','2')} = 3 : 2`)}，正好等于 ${M(`${v('R','2')} : ${v('R','1')} = 15 : 10`)}——电阻小的支路电流大。`]},
  pitfalls:['并联分流是「反比」，比例最容易写反。写完用「电阻小、电流大」检查一遍。','先看清电流表测干路还是支路。','求总电阻：串联时比任何一个电阻都大；并联时比任何一个支路电阻都小。']},

 {id:'k7',name:'测量装置中的电路分析与计算',star:5,diff:'难',
  std:{verb:'（无单列条目）',ref:'3.4.2 的应用',text:'课标无单列条目，属 3.4.2「理解欧姆定律」的应用。'},
  core:`很多测量仪器用的是同一个办法：让某个电阻随被测的量（温度、压力、液体多少……）变化，把它和定值电阻 ${v('R','0')} 串联，再用电表示数「代表」被测的量。分析按固定顺序：① 判断串联还是并联，电表测谁；② 被测的量变化 → 那个电阻怎么变 → 总电阻怎么变；③ 电源电压不变，总电阻变小，电流就变大；④ 再用 ${M(`${v('U')} = ${v('I')}${v('R')}`)} 判断 ${v('R','0')} 两端电压怎么变，电源电压减去它，就是变化电阻两端的电压。${FIG('sensor')}`,
  starWhy:'近 5 年有 3 年出现在第 21 题（2023、2025、2026），另有 2024 年第 14 题双选。',
  types:'综合应用、选择',pts:'综合应用整题 9 分（2025、2026）；选择 2 分（2024）',
  ex:{q:'电源电压 12 V，R₀ = 20 Ω 与随温度变化的电阻 Rt 串联，电流表测电路电流。已知 Rt 的阻值随温度升高而变小。',
   steps:['温度升高 → Rt 变小 → 总电阻变小 → 电源电压不变，电流表示数<b>变大</b>。',
          `电流表示数为 0.24 A 时：${M(`${v('U','0')} = 0.24 A × 20 Ω = 4.8 V`)}。`,
          `${M(`${v('U','t')} = 12 V − 4.8 V = 7.2 V`)}，${M(`${v('R','t')} = ${fr('7.2 V','0.24 A')} = 30 Ω`)}。再到题目给的图像上找 30 Ω 对应的温度。`]},
  pitfalls:['「电阻随温度升高变大还是变小」要从题目文字或图像里读出来，不能凭印象。','电压表接在定值电阻两端还是变化电阻两端，结论正好相反，先看清再判断。']},

 {id:'k8',name:'电学图像题',star:5,diff:'难',
  std:{verb:'（无单列条目）',ref:'3.4.2 的应用',text:'课标无单列条目，属 3.4.2「理解欧姆定律」的应用。'},
  core:`图像就是把很多组数据画在一起。读图三步：先看两条坐标轴各是什么量、什么单位；再在图上找一个点，读出<b>同一个元件、同一时刻</b>的一对数；最后把这对数代回欧姆定律或串并联规律。遇到「滑动变阻器在两个位置」的题，抓住<b>电源电压不变</b>：用两组数各列一个式子，让两式相等，就能求出未知的电阻和电源电压。${FIG('ui')}`,
  starWhy:'近 5 年有 4 年考到，其中 3 年以上出现在实验或综合大题中。',
  types:'填空、实验探究、综合应用',pts:'通常是题中的一问（分值未逐问取得）',
  ex:{q:'定值电阻 R₁ 与滑动变阻器 R₂ 串联，电压表测 R₂ 两端电压。移动滑片，得到上图中的两点：电流 0.2 A 时电压表 4 V；电流 0.4 A 时电压表 2 V。',
   steps:[`电源电压 = R₂ 两端电压 + R₁ 两端电压，两种情况下电源电压相同：`,
          `${M(`4 V + 0.2 A × ${v('R','1')} = 2 V + 0.4 A × ${v('R','1')}`)}，解得 ${M(`${v('R','1')} = 10 Ω`)}。`,
          `电源电压 ${M(`${v('U')} = 4 V + 0.2 A × 10 Ω = 6 V`)}。验证：滑片移到阻值为零时，电流 ${M(`${fr('6 V','10 Ω')} = 0.6 A`)}，正是图线与横轴的交点。`]},
  pitfalls:['读数前先确认这条线是哪个元件的。','两组数据别混用：同一组的电流和电压才能放进同一个式子。']},

 {id:'k9',name:'电路故障分析',star:5,diff:'中',
  std:{verb:'（无单列条目）',ref:'3.4.3、4.1.9 的应用',text:'课标无单列条目，属 3.4.3「会使用电流表和电压表」与必做实验 4.1.9 的应用。'},
  core:`以伏安法电路为例（电阻、变阻器、电流表串联，电压表测电阻）。先看电流表：有示数，说明电路是通的，故障多半是某处<b>短路</b>；没有示数，多半是某处<b>断路</b>（也可能是电流表自己被短接）。再看电压表：电压表接近电源电压而电流表几乎为零，说明和电压表并联的那部分断路，电压表被串进了电路；电流表有示数而电压表为零，说明和电压表并联的那部分短路，或电压表本身断路、没接好。`,
  starWhy:'近 5 年有 3 年在实验探究大题中考到（2023、2025、2026）。',
  types:'实验探究',pts:'实验题中的一空（2026 年第 18 题第 (2) 问 2 分，含滑片位置和故障两空）',
  ex:{q:'伏安法测电阻，闭合开关后：电流表几乎不动，电压表示数接近电源电压。',
   steps:['电流表几乎为零 → 电路某处断开。','电压表有示数 → 电压表两端到电源两极的路是通的，断点在电压表并联的部分。','所以是<b>定值电阻断路</b>（例如接线柱没拧紧）。']},
  pitfalls:['先判断电压表测的是哪一部分，再下结论。','「电流表有示数、电压表为零」有两种可能（被测电阻短路，或电压表断路），选择题里两种都可能出现。']},

 {id:'k10',name:'电源电压变化与装置改进',star:4,diff:'难',
  std:{verb:'（无单列条目）',ref:'3.4.2 的应用',text:'课标无单列条目，属 3.4.2「理解欧姆定律」的应用。'},
  core:`测量装置的刻度，是按「电源电压不变」刻好的。如果电源电压变小（比如电池用旧了），同一个被测量下电流会变小，仪表就会读错。判断读大还是读小：先想清楚在这台装置里「电流变小」原本代表被测量变大还是变小，再下结论。想扩大测量范围、又不让电表超量程时，常见办法是调电源电压或换定值电阻，依据仍是欧姆定律：电路的最大电流不能超过电表量程。`,
  starWhy:'近 5 年 3 年考到（2024 年第 14 题选项、2025 和 2026 年第 21 题最后一问），其中大题 2 年，按规则为 ★4。',
  types:'选择、综合应用（最后一问）',pts:'选择题一个选项；综合题最后一问（2026 年第 21 题第 (4) 问 2 分）',
  ex:{q:'沿用上面「测量装置」的例子：R₀ = 20 Ω，刻度按 12 V 刻好。电池用旧后只有 10.8 V，某温度下 Rt 实际为 30 Ω。',
   steps:[`实际电流 ${M(`${v('I')} = ${fr('10.8 V','20 Ω + 30 Ω')} ≈ 0.216 A`)}，比 0.24 A 小。`,
          `装置按 12 V 换算：${M(`${v('U','0')} = 0.216 A × 20 Ω ≈ 4.32 V`)}，${M(`${v('R','t')} ≈ ${fr('12 V − 4.32 V','0.216 A')} ≈ 35.6 Ω`)}，以为 Rt 比实际大。`,
          'Rt 越大对应温度越低，所以装置显示的温度<b>偏低</b>。']},
  pitfalls:['不要凭感觉说「电压小了读数就小」：要看电表示数和被测量是同向变化还是反向变化。','评价改进方案时，用欧姆定律写出理由，说清哪个量不变、哪个量怎么变。']}

function dialSVG(L,max,val,lab,label){
  const cx=80,cy=104,r=66,ang=x=>(-50+100*x/max)*Math.PI/180,P=(x,rr)=>[cx+rr*Math.sin(ang(x)),cy-rr*Math.cos(ang(x))],f=n=>n.toFixed(1);
  const neg=val<-1e-9, shown=Math.max(-max*0.05,Math.min(val,max*1.02));
  let s=`<svg class="dial" viewBox="0 0 160 132" role="img" aria-label="${esc(label)}"><rect x="1" y="1" width="158" height="130" rx="12" fill="#1d2127"/><rect x="9" y="9" width="142" height="92" rx="6" fill="#f8f4e6"/>`;
  const a0=P(0,r),a1=P(max,r);
  s+=`<path d="M${f(a0[0])} ${f(a0[1])}A${r} ${r} 0 0 1 ${f(a1[0])} ${f(a1[1])}" fill="none" stroke="#1d2127" stroke-width="1.3"/>`;
  for(let i=0;i<=30;i++){const x=max*i/30,q1=P(x,r),q2=P(x,r-(i%10===0?9:i%5===0?6:4));
    s+=`<line x1="${f(q1[0])}" y1="${f(q1[1])}" x2="${f(q2[0])}" y2="${f(q2[1])}" stroke="#1d2127" stroke-width="${i%10===0?1.4:.8}"/>`;}
  lab.forEach((t,i)=>{const q=P(max*i/(lab.length-1),r-18);s+=`<text x="${f(q[0])}" y="${f(q[1]+4)}" font-size="10" text-anchor="middle" fill="#1d2127" font-family="Arial,sans-serif">${t}</text>`;});
  const n=P(shown,r-6);
  s+=`<text x="26" y="94" font-size="16" font-weight="700" text-anchor="middle" fill="#1d2127" font-family="'Times New Roman',serif">${L}</text><line x1="80" y1="104" x2="${f(n[0])}" y2="${f(n[1])}" stroke="#c8102e" stroke-width="2"/><circle cx="80" cy="104" r="4" fill="#1d2127"/>`;
  s+=`<text x="80" y="122" font-size="13" text-anchor="middle" fill="${neg?'#ffb3b3':'#f1f3f6'}" font-family="Arial,sans-serif">${neg?'指针反偏':(L==='A'?val.toFixed(2)+' A':val.toFixed(1)+' V')}</text></svg>`;
  return s;
}

    s+=`</g><g stroke="${WC}" stroke-width="1.6" fill="none"><path d="M${X0} ${Y0}H${X1+8}M${X1+2} ${Y0-4}L${X1+8} ${Y0}L${X1+2} ${Y0+4}"/><path d="M${X0} ${Y0}V${Y1-10}M${X0-4} ${Y1-4}L${X0} ${Y1-10}L${X0+4} ${Y1-4}"/></g>`;
    const lbl=(t,uv)=>uv?String(t):t.toFixed(1);
    s+=`<g font-family="Arial,sans-serif" font-size="12" fill="#47556b">`;
    hT.forEach(t=>{const isLab=iu?Number.isInteger(t):[0.1,0.2,0.3].includes(t);if(isLab){const x=iu?px(t,0):px(0,t);s+=`<text x="${f(x)}" y="${Y0+17}" text-anchor="middle">${lbl(t,iu)}</text>`;}});
    vT.forEach(t=>{const isLab=iu?[0.1,0.2,0.3].includes(t):Number.isInteger(t);if(isLab){const y=iu?py(0,t):py(t,0);s+=`<text x="${X0-7}" y="${f(y+4)}" text-anchor="end">${lbl(t,!iu)}</text>`;}});
    s+=`</g><g font-family="${MF}" font-size="16" fill="${WC}"><text x="${X0-14}" y="${Y0+17}" font-style="italic">O</text>`+
      `<text x="${X1+12}" y="${Y0+5}"><tspan font-style="italic">${iu?'U':'I'}</tspan>/${iu?'V':'A'}</text><text x="${X0+8}" y="${Y1-2}"><tspan font-style="italic">${iu?'I':'U'}</tspan>/${iu?'A':'V'}</text></g>`;
    const keys=show==='b'?['r','l']:[show],rows=[];
    keys.forEach(k=>{const L=LN[k];let d='';for(let u=0;u<=Um+1e-9;u+=0.05){d+=(d?'L':'M')+f(px(u,L.I(u)))+' '+f(py(u,L.I(u)));}
      const I=L.I(U),x=px(U,I),y=py(U,I);
      // 图线名字：上面那条写在左上方，下面那条写在右下方（I–U 图上小灯泡在上，U–I 图上定值电阻在上）
      const upper=(k==='l')===iu,uL=upper?(k==='l'?1.2:1.8):(k==='l'?1.2:2.2),lx=px(uL,L.I(uL)),ly=py(uL,L.I(uL));
      s+=`<path d="${d}" fill="none" stroke="${L.col}" stroke-width="2.6"/>`+
        `<g stroke="${L.col}" stroke-width="1.2" stroke-dasharray="4 4" fill="none"><path d="M${f(x)} ${f(y)}V${Y0}M${f(x)} ${f(y)}H${X0}"/></g>`+
        (U>0?`<path d="M${X0} ${Y0}L${f(x)} ${f(y)}" stroke="${L.col}" stroke-width="1.2" opacity=".55"/>`:'')+
        `<circle cx="${f(x)}" cy="${f(y)}" r="5" fill="#fff" stroke="${L.col}" stroke-width="2.4"/>`+
        `<text x="${f(upper?lx-8:lx+10)}" y="${f(upper?ly-10:ly+24)}" text-anchor="${upper?'end':'start'}" font-family="${SANSF}" font-size="13.5" font-weight="700" fill="${L.col}">${L.name}</text>`;
      rows.push(`<tr><th>${L.name}</th><td>${U.toFixed(1)} V</td><td>${I.toFixed(3)} A</td><td>${U>0?(U/I).toFixed(1)+' Ω':'—'}</td></tr>`);});
    svg.innerHTML=s;
    root.querySelector('[data-o="u"]').textContent=U.toFixed(1);
    out.innerHTML=`<table class="iu-t"><thead><tr><th></th><th>U</th><th>I</th><th>R = U / I</th></tr></thead><tbody>${rows.join('')}</tbody></table>`+
      (keys.includes('l')?'<span class="note">小灯泡：电压越大，灯丝温度越高，电阻越大，所以图线是弯的。</span>':'<span class="note">定值电阻：电阻不变，电流与电压成正比，图线是过原点的直线。</span>');
   };
   rng.addEventListener('input',draw);
   root.querySelectorAll('[data-show]').forEach(b=>b.addEventListener('click',()=>{show=b.dataset.show;root.querySelectorAll('[data-show]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();}));
   root.querySelectorAll('[data-ax]').forEach(b=>b.addEventListener('click',()=>{ax=b.dataset.ax;root.querySelectorAll('[data-ax]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();}));
   draw();
  }}
};

/* 云朵形底：四边都是向外鼓的小圆弧 */
function cloud(x,y,w,h,step){
  const nx=Math.max(2,Math.round(w/step)),ny=Math.max(1,Math.round(h/step)),sx=w/nx,sy=h/ny,rx=f1(sx*.62),ry=f1(sy*.62);
  let d=`M${f1(x)} ${f1(y)}`;
  for(let i=0;i<nx;i++) d+=`a${rx} ${rx} 0 0 1 ${f1(sx)} 0`;
  for(let i=0;i<ny;i++) d+=`a${ry} ${ry} 0 0 1 0 ${f1(sy)}`;
  for(let i=0;i<nx;i++) d+=`a${rx} ${rx} 0 0 1 ${f1(-sx)} 0`;
  for(let i=0;i<ny;i++) d+=`a${ry} ${ry} 0 0 1 0 ${f1(-sy)}`;
  return d+'Z';
}
/* 学习状态小圆饼：空、三分之一、三分之二、满（打勾） */
function pieSVG(cx,cy,r,s){
  const c=ST_C[s];
  if(s===3) return `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${r}" fill="${c}"/><path d="M${f1(cx-r*.48)} ${f1(cy+r*.02)}L${f1(cx-r*.12)} ${f1(cy+r*.4)}L${f1(cx+r*.5)} ${f1(cy-r*.36)}" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  let h=`<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r-.7)}" fill="#fff" stroke="${c}" stroke-width="1.4"/>`;
  if(s>0){const a=2*Math.PI*s/3,x=cx+r*Math.sin(a),y=cy-r*Math.cos(a);h+=`<path d="M${f1(cx)} ${f1(cy)}V${f1(cy-r)}A${r} ${r} 0 ${a>Math.PI?1:0} 1 ${f1(x)} ${f1(y)}Z" fill="${c}"/>`;}
  return h;
}
/* 章号外圈：每段一个知识点，颜色是状态 */
function ringSVG(cx,cy,r,arr){
  const n=arr.length;if(!n)return '';
  if(n===1) return `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${r}" fill="none" stroke="${RING_C[arr[0]]}" stroke-width="3.4"/>`;
  const g=.16,p=a=>`${f1(cx+r*Math.sin(a))} ${f1(cy-r*Math.cos(a))}`;
  return arr.map((s,i)=>{const a0=i/n*2*Math.PI+g/2,a1=(i+1)/n*2*Math.PI-g/2;
    return `<path d="M${p(a0)}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${p(a1)}" fill="none" stroke="${RING_C[s]}" stroke-width="3.4"/>`;}).join('');
}

/* 排版：叶子从上往下排，父节点取子节点的中点；左右两侧各自居中 */
function layoutMap(kids,o){
  const all=[];
  ['R','L'].forEach(sd=>{
    const top=kids.filter(n=>n.side===sd);if(!top.length)return;
    const mine=[];let cur=0;
    const place=(n,d,first)=>{
      n.d=d;n.side=sd;all.push(n);mine.push(n);
      if(!first) cur+=o.gap[d]||0;
      const ch=n.children||[];
      if(!ch.length){n.cy=cur+n.h/2;cur+=n.h;return;}
      const start=cur,from=mine.length;
      ch.forEach((c,i)=>place(c,d+1,i===0));
      const span=cur-start;
      if(span<n.h){const sh=(n.h-span)/2;mine.slice(from).forEach(m=>m.cy+=sh);cur=start+n.h;}
      n.cy=(ch[0].cy+ch[ch.length-1].cy)/2;
    };
    top.forEach((n,i)=>place(n,1,i===0));
    mine.forEach(n=>n.cy-=cur/2);
    const maxW=[];mine.forEach(n=>maxW[n.d]=Math.max(maxW[n.d]||0,n.w));
    let e=o.half;const inner=[];
    for(let d=1;d<maxW.length;d++){e+=o.col[d];inner[d]=e;e+=maxW[d];}
    mine.forEach(n=>{const x=inner[n.d];
      if(sd==='R'){n.left=x;n.inX=x;n.outX=x+n.w;}else{n.left=-x-n.w;n.inX=-x;n.outX=-x-n.w;}});
  });
  return all;
}
function linkSVG(p,n,o){
  if(n.d===1) return `<path d="${taper(n.side==='R'?o.root:-o.root,0,n.inX,n.cy,o.t0,o.t1)}" fill="${n.color}"/>`;
  const x1=p.outX,y1=p.cy,x2=n.inX,y2=n.ul?n.cy+n.ulY:n.cy,m=(x1+x2)/2;
  let d=`M${f1(x1)} ${f1(y1)}C${f1(m)} ${f1(y1)} ${f1(m)} ${f1(y2)} ${f1(x2)} ${f1(y2)}`;
  if(n.ul) d+=`H${f1(n.side==='R'?n.left+n.w:n.left)}`;
  return `<path d="${d}" fill="none" stroke="${n.color}" stroke-width="${o.sw[n.d]}"${n.ul?' stroke-opacity=".7"':''} stroke-linecap="round"/>`;
}
/* 图例：一组一组往右排，排不下换行 */
function flowLegend(groups,x,y,maxW){
  let cx=x,cy=y,s='';const LH=27;
  groups.forEach(g=>{
    if(g==='br'){cx=x;cy+=LH;return;}
    const gw=g.reduce((a,it)=>a+it.w,0)+10*(g.length-1);
    if(cx>x&&cx+gw>x+maxW){cx=x;cy+=LH;}
    g.forEach((it,i)=>{if(i)cx+=10;s+=it.d(cx,cy);cx+=it.w;});
    cx+=30;
  });
  return {svg:s,h:cy-y+LH};
}

function drawMap(o){

  let clouds='';
  if(o.clouds) all.filter(n=>n.d===1).forEach(b=>{
    const g=all.filter(m=>m===b||m.k.startsWith(b.k+'-')),P=18;
    const a=Math.min(...g.map(m=>m.left))-P,z=Math.max(...g.map(m=>m.left+m.w))+P,t=Math.min(...g.map(m=>m.cy-m.h/2))-P,u=Math.max(...g.map(m=>m.cy+m.h/2))+P;

${clouds}${o.center.back?o.center.back():''}${layers.slice(1).map(l=>l.join('')).join('')}${o.center.draw()}${lg.svg}</svg>`;

/* 交互：放大、拖动、全屏、悬停高亮、保存为图片 */
const MAPS=[];
function paintPies(root){
  root=root||document;
  const nameOf={};window.CH17.cards.forEach(c=>nameOf[c.id]=c.name);
  root.querySelectorAll('[data-pie]').forEach(g=>{const s=stOf(g.dataset.pie);g.innerHTML=`<title>${esc(nameOf[g.dataset.pie]||'')}：${esc(names[s])}</title>`+pieSVG(+g.dataset.cx,+g.dataset.cy,+g.dataset.r,s);});
  root.querySelectorAll('[data-ring]').forEach(g=>{const d=window['CH'+g.dataset.ring];if(d)g.innerHTML=ringSVG(+g.dataset.cx,+g.dataset.cy,+g.dataset.r,d.cards.map(c=>stOf(c.id)));});

function bindHover(svg){
  const gs=Array.from(svg.querySelectorAll('.mm-g'));
  const rel=(a,b)=>a===b||a.startsWith(b+'-')||b.startsWith(a+'-');
  const on=el=>{const ks=[el.dataset.k].concat(el.dataset.x?el.dataset.x.split(','):[]);svg.classList.add('mm-focus');gs.forEach(g=>g.classList.toggle('on',ks.some(k=>rel(g.dataset.k,k))));};
  const off=()=>svg.classList.remove('mm-focus');
  svg.addEventListener('pointerover',e=>{const n=e.target.closest('.mm-node');if(n)on(n);});
  svg.addEventListener('pointerout',e=>{const n=e.target.closest('.mm-node');if(n&&!(e.relatedTarget&&n.contains(e.relatedTarget)))off();});
  svg.addEventListener('focusin',e=>{const n=e.target.closest('.mm-node');if(n)on(n);});
  svg.addEventListener('focusout',off);
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
function exportPNG(build,fname){
  const tmp=document.createElement('div');tmp.style.cssText='position:absolute;left:-99999px;top:0;width:1200px';
  tmp.innerHTML=build();document.body.appendChild(tmp);paintPies(tmp);
  const c=tmp.querySelector('svg'),b=c.getAttribute('viewBox').split(' ').map(Number),S=2;
  c.setAttribute('width',Math.round(b[2]*S));c.setAttribute('height',Math.round(b[3]*S));
  const xml=new XMLSerializer().serializeToString(c);tmp.remove();
  const fallback=()=>download(new Blob([xml],{type:'image/svg+xml'}),fname+'.svg');
  const img=new Image();
  img.onload=()=>{try{const cv=document.createElement('canvas');cv.width=Math.round(b[2]*S);cv.height=Math.round(b[3]*S);
      const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);
      cv.toBlob(bl=>bl?download(bl,fname+'.png'):fallback(),'image/png');}catch(err){fallback();}};
  img.onerror=fallback;
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
}
function mapTools(withDepth){
  return `<div class="mm-tools no-print"><span class="seg" role="group" aria-label="版式"><button type="button" data-view="map">横版</button><button type="button" data-view="list">竖版</button></span>${withDepth?'<span class="seg" role="group" aria-label="显示到哪一层"><button type="button" data-depth="2">只看到章</button><button type="button" data-depth="3">展开到节</button></span>':''}<span class="mm-zoom map-only"><button class="btn" type="button" data-act="in">放大</button><button class="btn" type="button" data-act="out">缩小</button><button class="btn" type="button" data-act="fit">复位</button><button class="btn" type="button" data-act="full">全屏</button></span><button class="btn" type="button" data-act="png">保存为图片</button><span class="mm-hint map-only">放大后可拖动画面；全屏时可用滚轮缩放，按 Esc 退出</span></div>`;
}
function mountMap(wrap,opt){
  const build=opt.svg,fname=opt.fname,stage=wrap.querySelector('.mm-stage'),vstage=wrap.querySelector('.vm-stage'),M={wrap};
  M.svg=()=>stage.querySelector('svg');
  const set=()=>{M.svg().setAttribute('viewBox',M.vb.map(f1).join(' '));wrap.classList.toggle('zoomed',M.vb[2]<M.base[2]-.5);};
  const clamp=()=>{const b=M.base,v=M.vb;v[0]=Math.min(Math.max(v[0],b[0]),b[0]+b[2]-v[2]);v[1]=Math.min(Math.max(v[1],b[1]),b[1]+b[3]-v[3]);};
  M.render=()=>{stage.innerHTML=build();vstage.innerHTML=opt.list();M.base=M.svg().getAttribute('viewBox').split(' ').map(Number);M.vb=M.base.slice();wrap.classList.remove('zoomed');bindHover(M.svg());paintPies(wrap);};
  M.zoomTo=bb=>{const b=M.base,r=b[3]/b[2];let [x,y,w,h]=bb;
    if(h/w>r){const nw=h/r;x-=(nw-w)/2;w=nw;}else{const nh=w*r;y-=(nh-h)/2;h=nh;}
    if(w>b[2]){w=b[2];h=b[3];}
    M.vb=[x,y,w,h];clamp();set();};
  // 竖版：点箭头展开/收起各节，点板块名收起整块
  vstage.addEventListener('click',e=>{
    const t=e.target.closest('.vm-tog');
    if(t){const ul=t.closest('.vm-chap').querySelector('.vm-secs');const on=t.getAttribute('aria-expanded')!=='true';t.setAttribute('aria-expanded',String(on));ul.hidden=!on;return;}
    const bh=e.target.closest('.vm-bhead');
    if(bh){const ol=bh.nextElementSibling;const on=bh.getAttribute('aria-expanded')!=='true';bh.setAttribute('aria-expanded',String(on));ol.hidden=!on;}
  });
  M.fit=()=>{if(!M.base)return;M.vb=M.base.slice();set();};
  M.zoom=(k,px,py)=>{const b=M.base,v=M.vb,nw=Math.min(b[2],Math.max(b[2]/6,v[2]/k)),r=nw/v[2];
    if(px==null){px=v[0]+v[2]/2;py=v[1]+v[3]/2;}
    M.vb=[px-(px-v[0])*r,py-(py-v[1])*r,nw,nw*b[3]/b[2]];clamp();set();};
  M.full=on=>{if(on===wrap.classList.contains('mm-full'))return;
    wrap.classList.toggle('mm-full',on);document.documentElement.classList.toggle('mm-lock',on);
    const btn=wrap.querySelector('[data-act="full"]');if(btn){btn.textContent=on?'退出全屏':'全屏';btn.focus({preventScroll:true});}
    if(!on)M.fit();};
  wrap.querySelector('.mm-tools').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act;
    if(a==='in')M.zoom(1.5);else if(a==='out')M.zoom(1/1.5);else if(a==='fit')M.fit();
    else if(a==='full')M.full(!wrap.classList.contains('mm-full'));else if(a==='png')exportPNG(build,fname);});
  // 拖动（只在放大后）
  const pt=(x,y,inv)=>{const p=M.svg().createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(inv);};
  let drag=null,moved=false,swallow=false;
  stage.addEventListener('pointerdown',e=>{if(e.button!==0||!wrap.classList.contains('zoomed'))return;
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,inv:M.svg().getScreenCTM().inverse(),vb:M.vb.slice()};moved=false;});
  stage.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;
    if(!moved){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5)return;moved=true;stage.setPointerCapture(e.pointerId);wrap.classList.add('dragging');}
    const p0=pt(drag.x,drag.y,drag.inv),p1=pt(e.clientX,e.clientY,drag.inv);
    M.vb[0]=drag.vb[0]-(p1.x-p0.x);M.vb[1]=drag.vb[1]-(p1.y-p0.y);clamp();set();});
  const end=()=>{if(!drag)return;if(moved){swallow=true;setTimeout(()=>{swallow=false;},80);wrap.classList.remove('dragging');}drag=null;};
  stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
  stage.addEventListener('click',e=>{if(swallow){e.preventDefault();e.stopPropagation();swallow=false;}},true);
  stage.addEventListener('click',e=>{const bn=e.target.closest('.mm-node[data-bb]');if(bn)M.zoomTo(bn.dataset.bb.split(' ').map(Number));});
  // 滚轮缩放：只在全屏时，或按住 Ctrl 时（平时滚轮照常翻页）
  stage.addEventListener('wheel',e=>{if(!wrap.classList.contains('mm-full')&&!e.ctrlKey)return;e.preventDefault();
    const p=pt(e.clientX,e.clientY,M.svg().getScreenCTM().inverse());M.zoom(e.deltaY<0?1.25:1/1.25,p.x,p.y);},{passive:false});
  MAPS.push(M);M.render();
  return M;
}

     <li>有的知识点还有几种小卡片：<b>生活中的物理</b>（米黄底：现象 → 谁在变 → 怎么变 → 对应规律）、<b>陷阱卡</b>（红点：错误想法 → 为什么错 → 正确说法）、<b>类比卡</b>、<b>实验设计三问</b>、<b>故障两步判断</b>。</li>
     <li>标着「<span class="orig">原创讲法</span>」「<span class="mnem">记忆辅助</span>」的，是帮助理解和记忆的说法，课本上不一定这样写；考试答题按课本的说法。</li></ul>`},
   {t:'动手模拟',go:'#k7 .sim',html:`<h3>动手模拟</h3><ul>
     <li>标着「交互模拟」的灰色面板可以动手：拖动滑片、点按钮，电表指针和数字会跟着变。</li>
     <li>第十七章有 3 个：滑片移动，两只表怎么变（测量装置）；电压表测的是谁，点「导线染色」看同色导线（串、并联应用）；定值电阻和小灯泡的 I–U 图像（小灯泡的电阻）。</li>
     <li>用法：<b>先自己猜结果，再动手验证</b>，再看下面写出的变化过程。</li>
     <li>模拟里的数据是原创示例，不是真题；打印时不印模拟。</li></ul>`},
   {t:'标记学习状态',go:'#k2 .status-pick',html:`<h3>标记学习状态</h3><ul>
     <li>每个知识点右上角有「我的状态」，四档：${names.map(esc).join(' → ')}。</li>
     <li>选好以后，卡片标题旁的标签、两张导图里的小圆饼和彩色圈、顶部的统计数字会一起变。</li>
     <li>名称可以改成自己习惯的叫法：${K('改状态名称')}（手机上在${K('筛选与进度')}里）。</li>
     <li>状态只保存在<b>这台设备的这个浏览器</b>里，记得备份（见「备份与换设备」）。</li></ul>`},
   {t:'搜索和筛选',go:'#tools',filt:true,html:`<h3>搜索和筛选</h3><ul>
     <li>在搜索框输入关键词（比如「故障」「并联」「图像」），只留下含这个词的知识点；公式铭牌、实验和对比表也会一起筛。</li>
     <li>还可以按<b>重要度、考频、难度</b>筛，登录后可勾「只看有错题的」，或按<b>状态</b>筛。复习时最好用：状态选「${esc(names[1])}」，只看还要练的。</li>
     <li>想看回全部：清空搜索框，把各项改回「全部」。</li>
     <li>手机上这些都收在顶部的${K('筛选与进度')}里，按钮上的数字表示正在用几个筛选。</li></ul>`},
   {t:'高中内容',go:'.hs-switch',filt:true,html:`<h3>高中内容</h3><ul>
     <li>打开顶部的「显示高中内容」，每章最后会出现紫色的「高中内容 · 中招不考」。</li>
     <li>每条讲三件事：初中怎么说、高中怎么深化、现在要做到什么程度。</li>
     <li>只需了解，<b>中招考试按初中的说法答题</b>。</li></ul>`},
   {t:'备份与换设备',go:'#exportBtn',filt:true,html:`<h3>备份进度、换设备</h3><ul>
     <li>学习状态只存在当前浏览器里。清理浏览器数据、换电脑或换浏览器，都看不到原来的标记。</li>
     <li>${K('导出进度')}：下载一个「物理进度.json」文件，保存好。建议每周导出一次。</li>
     <li>到另一台设备上打开这个网页，点${K('导入进度')}，选这个文件，就能接着用；改过的状态名称也会一起带过去。</li></ul>`},
   {t:'打印',html:`<h3>打印</h3><ul>
     <li>电脑上按 ${K('Ctrl')} + ${K('P')}（苹果电脑是 ${K('⌘')} + ${K('P')}），打印时会自动展开所有收起的内容。</li>
     <li>知识地图只印到「章」，单独占一页横版纸；各节看后面的文字版目录。想要带节的大图，先${K('保存为图片')}，再用 A3 纸打印。</li>
     <li>每章从新的一页开始；高中内容只有打开开关时才会打印。</li>
     <li>交互模拟、故障两步判断、题头的电表只在屏幕上用，不打印；「实验设计三问」的两张表都会印出来。</li></ul>`},
   {t:'在手机上用',go:'#tocBtn',html:`<h3>在手机上用</h3><ul>
     <li>用手机浏览器打开这个网页文件。如果在微信等聊天软件里点开后功能不正常，选「用其他应用打开」，换成手机浏览器。</li>
     <li>顶部只留标题和两个按钮：${K('指南')} 和 ${K('筛选与进度')}（搜索、筛选、统计、导出导入都在里面）。</li>
     <li>右下角的${K('目录')}可以跳到任何位置。</li>
     <li>导图默认是竖版；想看整张大图，点${K('横版')}，可以左右滑动。</li></ul>`},
   {t:'怎么用它复习',html:`<h3>怎么用它复习</h3><ol>
     <li>先看知识地图，找出圆点多的章：这些章年年考。</li>
     <li>打开一章，先看「本章导图」，按 ★ 从多到少读知识点，自己记过错题的优先。</li>
     <li>每个知识点：读核心 → 看生活中的物理和陷阱卡 → 动手模拟 → 自己想例题 → 点开看思路 → 看易错提醒 → 标状态。</li>
     <li>复习时用「状态」筛选，只看「${esc(names[1])}」和「${esc(names[2])}」；登录后勾「只看有错题的」专门补弱项。</li>
     <li>真正会了再标「${esc(names[3])}」，看着彩色圈一点点变绿。</li></ol>
     <p class="note">指南看完了。点${K('开始使用')}关掉它；以后随时点顶部的${K('使用指南')}再看。</p>`}
  ];
}

/* ---------- 交互 ---------- */
function fillOptions(){
  const opts=names.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');
  $$('select[data-id]').forEach(sel=>{sel.innerHTML=opts;});
  const f=$('#fStatus'), keep=f.value;
  f.innerHTML='<option value="">全部</option>'+opts; f.value=keep;
}
function syncStatus(){
  $$('select[data-id]').forEach(sel=>{sel.value=String(stOf(sel.dataset.id));});
  $$('.st[data-st-for]').forEach(b=>{const s=stOf(b.dataset.stFor);b.dataset.s=s;b.textContent=names[s];});
  $$('.kp').forEach(el=>{el.dataset.status=stOf(el.id);});
  paintPies();
  const cards=window.CH17.cards, cnt=[0,0,0,0];cards.forEach(c=>cnt[stOf(c.id)]++);
  $('#progress').textContent=[3,2,1,0].map(i=>`${names[i]} ${cnt[i]}`).join('，')+`（共 ${cards.length}）`+(store.ok?'':'。此浏览器不能保存进度，请用「导出进度」');
}
function applyFilters(){
  const q=$('#q').value.trim(), fs=+$('#fStar').value, ft=$('#fTier').value, fd=$('#fDiff').value, fw=$('#fWeak').checked, fst=$('#fStatus').value;
  let shown=0;
  $$('.kp').forEach(el=>{
    let ok=true;
    if(fs && +el.dataset.star<fs) ok=false;
    if(ft && el.dataset.tier!==ft) ok=false;
    if(fd && el.dataset.diff!==fd) ok=false;
    if(fw && el.dataset.weak!=='1') ok=false;
    if(fst!=='' && String(stOf(el.id))!==fst) ok=false;
    if(q && !el.textContent.includes(q)) ok=false;
    el.hidden=!ok; if(ok) shown++;
  });
  $$('.sec-h').forEach(h=>{h.hidden=h.dataset.cards.split(',').every(id=>document.getElementById(id).hidden);});
  const nOn=[q,fs,ft,fd,fw,fst!==''].filter(Boolean).length;
  $('#filtBtn').textContent='筛选与进度'+(nOn?`（${nOn}）`:'');
  $('#noCards').style.display=shown?'none':'block';
  $('#cardCount').textContent=`显示 ${shown} / ${window.CH17.cards.length} 个知识点`+(q?`（关键词「${q}」也会筛选下面的公式表、实验和对比表）`:'');
  $$('.plate, .ctbl tbody tr').forEach(tr=>{tr.hidden=!!q && !tr.textContent.includes(q);});
  $$('.exp').forEach(x=>{x.hidden=!!q && !x.textContent.includes(q);});
}
function resetFilters(){$('#q').value='';$('#fStar').value='0';['#fTier','#fDiff','#fStatus'].forEach(s=>{$(s).value='';});$('#fWeak').checked=false;applyFilters();}
function setHS(on){showHS=on;document.body.classList.toggle('show-hs',on);$('#hsToggle').checked=on;store.set('wlzs.showHS',on);}

function init(){
  renderNav();
  $('#atlas').innerHTML=`<div class="atlas-head"><h2 id="atlasTitle">知识地图</h2><p>全书 6 个板块、22 章、各节，一张图看完。颜色分板块，圆点是考频，小圆饼是自己标的学习状态。点章、节、知识点可直接跳过去。第一次用，先点顶部的「使用指南」。</p></div><div class="mm" id="atlasMM">${mapTools(true)}<div class="mm-stage"></div><div class="vm-stage"></div></div>`;
  $('#main').innerHTML=renderBook()+renderChapter()+renderLog();
  initCards();
  // 知识地图：默认展开到节；窄屏默认只到章。选择会记住
  let atlasDepth=store.get('wlzs.atlasDepth',null);
  if(atlasDepth!==2&&atlasDepth!==3) atlasDepth=window.matchMedia('(max-width:760px)').matches?2:3;
  const atlasM=mountMap($('#atlasMM'),{svg:()=>buildAtlas(atlasDepth),list:()=>buildAtlasList(atlasDepth),fname:'初中物理知识地图'});
  const depthBtns=()=>$$('#atlasMM [data-depth]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.depth===atlasDepth)));
  depthBtns();
  $('#atlasMM .seg').addEventListener('click',e=>{const b=e.target.closest('[data-depth]');if(!b)return;
    atlasDepth=+b.dataset.depth;store.set('wlzs.atlasDepth',atlasDepth);depthBtns();atlasM.render();});
  mountMap($('#ch17mm'),{svg:()=>buildChapterMap(window.CH17),list:()=>buildChapterList(window.CH17),fname:'第十七章导图'});
  // 横版（大图）/ 竖版（手机列表）：手机默认竖版，选择会记住
  let mapView=store.get('wlzs.mapView',null);
  if(mapView!=='map'&&mapView!=='list') mapView=window.matchMedia('(max-width:760px)').matches?'list':'map';
  const setView=v=>{mapView=v;store.set('wlzs.mapView',v);MAPS.forEach(m=>{m.full(false);m.wrap.classList.toggle('is-list',v==='list');});
    $$('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===v)));};
  setView(mapView);
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-view]');if(b)setView(b.dataset.view);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){MAPS.forEach(m=>m.full(false));setToc(false);}});
  // 手机：顶栏的「筛选与进度」、右下角的「目录」
  const topbar=$('.topbar');
  const setFilt=on=>{topbar.classList.toggle('open',on);$('#filtBtn').setAttribute('aria-expanded',String(on));};
  $('#filtBtn').addEventListener('click',()=>setFilt(!topbar.classList.contains('open')));
  function setToc(on){document.body.classList.toggle('toc-open',on);$('#tocBtn').setAttribute('aria-expanded',String(on));$('#tocBtn').textContent=on?'关闭':'目录';}
  $('#tocBtn').addEventListener('click',()=>setToc(!document.body.classList.contains('toc-open')));
  $('#tocMask').addEventListener('click',()=>setToc(false));
  // 使用指南
  const gd=$('#guideDlg');let gPages=[],gi=0;
  // 目标可能有几个候选（如横版/竖版），取当前看得见的那个
  const gEl=pg=>{if(!pg.go)return null;const els=pg.go.split(',').map(x=>$(x.trim())).filter(Boolean);return els.find(el=>el.getClientRects().length)||els[0]||null;};
  const gVisible=pg=>{const el=gEl(pg);return !!el&&(!!pg.filt||el.getClientRects().length>0);};
  const gShow=i=>{gi=Math.max(0,Math.min(gPages.length-1,i));const pg=gPages[gi];
    $('#guideTabs').innerHTML=gPages.map((x,j)=>`<button type="button" role="tab" aria-selected="${j===gi}" data-gi="${j}">${x.t}</button>`).join('');
    $('#guideBody').innerHTML=pg.html;$('#guideBody').scrollTop=0;
    $('#guidePos').textContent=`${gi+1} / ${gPages.length}`;
    $('#guidePrev').disabled=gi===0;
    $('#guideNext').textContent=gi===gPages.length-1?'开始使用':'下一页';
    $('#guideGo').hidden=!gVisible(pg);
    const tab=$(`#guideTabs [data-gi="${gi}"]`);if(tab)tab.scrollIntoView({block:'nearest',inline:'center'});};
  const openGuide=i=>{gPages=guidePages();setToc(false);setFilt(false);MAPS.forEach(m=>m.full(false));gShow(i||0);
    if(gd.showModal)gd.showModal();else gd.setAttribute('open','');};
  const closeGuide=()=>{store.set('wlzs.guideSeen',true);if(gd.open)gd.close();};
  gd.addEventListener('close',()=>store.set('wlzs.guideSeen',true));
  $('#guideBtn').addEventListener('click',()=>openGuide(0));
  $('#guideClose').addEventListener('click',closeGuide);
  $('#guidePrev').addEventListener('click',()=>gShow(gi-1));
  $('#guideNext').addEventListener('click',()=>{if(gi===gPages.length-1)closeGuide();else gShow(gi+1);});
  $('#guideTabs').addEventListener('click',e=>{const b=e.target.closest('[data-gi]');if(b)gShow(+b.dataset.gi);});
  gd.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;
    if(e.key==='ArrowRight'){e.preventDefault();gShow(gi+1);}else if(e.key==='ArrowLeft'){e.preventDefault();gShow(gi-1);}});
  gd.addEventListener('click',e=>{if(e.target===gd)closeGuide();});   // 点遮罩关闭
  $('#guideGo').addEventListener('click',()=>{
    const pg=gPages[gi];closeGuide();
    if(pg.filt&&window.matchMedia('(max-width:760px)').matches)setFilt(true);
    const el=gEl(pg);if(!el)return;
    const kp=el.closest('.kp');if(kp&&kp.hidden)resetFilters();
    if(!el.closest('.topbar')&&getComputedStyle(el).position!=='fixed') el.scrollIntoView({behavior:'smooth',block:el.getBoundingClientRect().height>window.innerHeight*.6?'start':'center'});
    el.classList.remove('spot');void el.offsetWidth;el.classList.add('spot');
    setTimeout(()=>el.classList.remove('spot'),3600);
  });
  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-open-guide]');if(a){e.preventDefault();openGuide(0);}});
  // 第一次打开（这个浏览器里没看过指南）时自动弹出
  if(store.ok&&!store.get('wlzs.guideSeen',false)) setTimeout(()=>{if(store.ok&&!document.querySelector('dialog[open]'))openGuide(0);},400);
  // 跳转：点图里、目录里任何一个「#…」链接，先展开折叠的目录、清掉挡住目标的筛选，再滚过去并闪一下
  document.addEventListener('click',e=>{
    const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;
    const id=decodeURIComponent((a.getAttribute('href')||'').slice(1)),t=id&&document.getElementById(id);if(!t)return;
    const kp=t.closest('.kp');
    if((kp&&kp.hidden)||t.hidden) resetFilters();
    for(let p=t;p;p=p.parentElement) if(p.tagName==='DETAILS') p.open=true;
    MAPS.forEach(m=>m.full(false));setToc(false);setFilt(false);
    const f=t.tagName==='DETAILS'?t.querySelector('summary'):t;
    f.classList.remove('flash');void f.offsetWidth;f.classList.add('flash');
    setTimeout(()=>f.classList.remove('flash'),2000);
  });
  setHS(!!showHS);
  fillOptions();syncStatus();applyFilters();
  $('#main').addEventListener('change',e=>{
    const sel=e.target.closest('select[data-id]');if(!sel)return;
    const v=+sel.value; if(v===0) delete status[sel.dataset.id]; else status[sel.dataset.id]=v;
    store.set('wlzs.status',status);syncStatus();applyFilters();
  });
  ['#q','#fStar','#fTier','#fDiff','#fWeak','#fStatus'].forEach(s=>$(s).addEventListener('input',applyFilters));
  // 改状态名称
  const dlg=$('#namesDlg'), form=$('#namesForm');
  const fillForm=arr=>arr.forEach((n,i)=>{form.elements['n'+i].value=n;});
  $('#namesBtn').addEventListener('click',()=>{fillForm(names);if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');});
  $('#namesReset').addEventListener('click',()=>fillForm(DEFAULT_NAMES));
  dlg.addEventListener('close',()=>{
    if(dlg.returnValue!=='save')return;
    const arr=[0,1,2,3].map(i=>form.elements['n'+i].value.trim());
    if(arr.some(n=>!n))return;
    names=arr;store.set('wlzs.statusNames',names);fillOptions();MAPS.forEach(m=>m.render());syncStatus();applyFilters();
  });
  $('#hsToggle').addEventListener('change',e=>setHS(e.target.checked));
  $('#exportBtn').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify({app:'初中物理知识体系',version:2,exported:new Date().toISOString(),status,names},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='物理进度.json';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  });
  $('#importBtn').addEventListener('click',()=>$('#importFile').click());
  $('#importFile').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d)throw 0;
        if(d.status&&typeof d.status==='object'){Object.keys(d.status).forEach(id=>{const v=+d.status[id];if(v>=1&&v<=3)status[id]=v;});}
        else if(d.mastered&&typeof d.mastered==='object'){Object.keys(d.mastered).forEach(id=>{if(d.mastered[id])status[id]=3;});}
        else throw 0;
        if(Array.isArray(d.names)&&d.names.length===4&&d.names.every(n=>typeof n==='string'&&n.trim())){names=d.names;store.set('wlzs.statusNames',names);fillOptions();MAPS.forEach(m=>m.render());}
        store.set('wlzs.status',status);syncStatus();applyFilters();
        $('#progress').textContent+='　已导入';}
      catch(err){$('#progress').textContent='导入失败：请选择用「导出进度」保存的 .json 文件';}};
    r.readAsText(f,'utf-8');e.target.value='';
  });
  // 打印：展开全部折叠内容、显示被筛掉的条目，打印完恢复
  let closed=[];
  let printSwap=false;
  window.addEventListener('beforeprint',()=>{
    MAPS.forEach(m=>{m.full(false);m.fit();});
    if(gd.open)gd.close();
    if(atlasDepth===3){printSwap=true;atlasDepth=2;atlasM.render();atlasDepth=3;}   // 打印时知识地图只到章，一页横版；各节见文字版目录
    closed=$$('details:not([open])');closed.forEach(d=>d.open=true);});
  window.addEventListener('afterprint',()=>{if(printSwap){printSwap=false;atlasM.render();}closed.forEach(d=>d.open=false);closed=[];});
}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
<script src="../shared/mistakes.js" data-subject="physics"></script>
