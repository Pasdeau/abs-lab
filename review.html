<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日重测 · ABS-LAB</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="shared/quiz/quiz.css" />
  <script src="shared/auth.js"></script>
  <style>
    /* 「返回首页」在手机上也按「按钮至少 44px 高」处理（theme.css 在窄屏把它压小了） */
    .hero-pill-btn { min-height: 44px; }
  </style>
</head>
<body>
  <script src="shared/topbar.js" data-root="." data-page="review"></script>

  <header class="hero-banner">
    <div class="hero-inner">
      <div>
        <h1>今日重测</h1>
        <p>理解测试里做错的题，按错误概念存进错题本，隔几天再测一次。每次换一道新情境的题：先作答，再看反馈。</p>
      </div>
      <a class="hero-pill-btn" href="index.html">← 返回首页</a>
    </div>
  </header>

  <main class="container">
    <div id="qz-review-root">
      <noscript><p class="qz-error">这个页面需要打开浏览器的 JavaScript 才能使用。</p></noscript>
    </div>
  </main>

  <footer class="footer">ABS-LAB · Authors: Wenzheng Wang · Hang Li</footer>
  <script src="shared/svgkit.js"></script>
  <script src="shared/quiz/core.js"></script>
  <script src="shared/quiz/engine.js"></script>
  <script>
    (function () {
      var root = document.getElementById("qz-review-root");
      // ?tag=<错误概念标签> 只重测这一项（错题本抽屉里的「去重测 →」）；?item=<题目 id> 只重测按题记的那条错题
      function param(name) {
        try { return new URLSearchParams(window.location.search).get(name) || ""; } catch (e) {
          var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(window.location.search);
          return m ? decodeURIComponent(m[1]) : "";
        }
      }
      // 格式不对的参数直接忽略（当成没有筛选），不拿它去拼页面
      var tag = param("tag"), item = param("item");
      if (!/^[a-z][a-z0-9]{5,31}$/.test(tag)) tag = "";
      if (!/^[a-z0-9][a-z0-9-]{2,47}$/.test(item)) item = "";
      if (!window.ABSLabQuiz) {
        root.innerHTML = '<p class="qz-error">页面没有加载完整，请检查网络后刷新。</p>';
        return;
      }
      window.ABSLabQuiz.mountReview(root, { tag: tag, item: item });
    })();
  </script>
</body>
</html>
