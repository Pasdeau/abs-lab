<!DOCTYPE html>
<!-- 网站公开版：由 tools/sync-maps.py 从项目里的导图生成（已去掉个人考试信息）。要改内容请改原始导图后重新同步，不要直接改这个文件。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初中化学知识体系 · 全书知识点清单</title>
<style>
:root{
  --ink:#17233a; --ink-2:#47556b; --ink-3:#6b7a90;
  /* 化学主色：橙。只用于大面积底色、题头和标题；考频、学习状态等小标记四科同色并配文字 */
  --pen:#9a3412; --pen-soft:#ffedd5; --hl:#ea580c; --pen-line:#fdba74;
  --paper:#f5f2ec; --sheet:#ffffff; --rule:#eadccb; --grid:#f5ebe0;
  --t5:#b42318; --t4:#c2410c; --t3:#1d4ed8; --t2:#64748b;
  --weak:#9f1239; --ok:#15803d;
  --hs:#6b46c1; --hs-bg:#f3eefc; --hs-rule:#d9cdf3;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --chem:"Times New Roman","Noto Serif","DejaVu Serif",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.8}
a{color:var(--pen)}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;line-height:1.35;color:var(--ink)}
p{margin:.4em 0 .8em}

/* 化学用语：化学式下标、离子电荷上标、化合价在正上方、方程式条件在等号上方 */
.f{font-family:var(--chem);white-space:nowrap}
sub,sup{font-size:.72em;line-height:0;position:relative}
sub{bottom:-.25em;vertical-align:baseline}
sup{top:-.5em;vertical-align:baseline}
ruby.val{ruby-position:over;font-family:var(--chem)}
ruby.val rt{font-size:.68em;font-family:var(--chem);color:var(--ink-2)}
.eq{display:inline;font-family:var(--chem)}
.eq .t,.eqr{white-space:nowrap}
.eqs{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .3em;line-height:1.15;font-family:var(--sans)}
.eqs .c{font-size:.7em;min-height:1.05em;white-space:nowrap;padding:0 .15em;font-family:var(--chem)}
.eqs .ln{display:block;width:100%;min-width:2.4em;height:.36em;border-top:1.5px solid currentColor;border-bottom:1.5px solid currentColor}
/* 自测模式：遮住生成物、俗名、颜色、现象 */
body.selftest .mask:not(.shown){color:transparent!important;background:repeating-linear-gradient(135deg,#e6ddd2 0 6px,#f2ece4 6px 12px);border-radius:4px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
body.selftest .mask:not(.shown) *{color:transparent!important;border-color:transparent!important}
body.selftest .mask.shown{background:#fff7d6;border-radius:4px}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--hl)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 20px}
.brand{font-family:var(--serif);font-weight:700;font-size:18px;margin-right:auto}
.brand small{font-family:var(--sans);font-weight:400;color:var(--ink-3);font-size:14px;margin-left:8px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:15px}
.tools input[type=search]{font:inherit;font-size:15px;padding:5px 10px;border:1px solid var(--rule);border-radius:6px;width:15em}
.tools select{font:inherit;font-size:15px;padding:4px 6px;border:1px solid var(--rule);border-radius:6px;background:#fff}
.tools label{white-space:nowrap}
.hs-switch{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--hs-rule);border-radius:20px;background:var(--hs-bg);color:var(--hs)}
.st-switch{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid #f0d58a;border-radius:20px;background:#fffbeb;color:#92400e}
.btn{font:inherit;font-size:14px;padding:4px 10px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--pen)}
.status{font-size:14px;color:var(--ink-3)}

/* 版式 */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;max-width:1240px;margin:0 auto;padding:24px 20px 80px}
.sidenav{position:sticky;top:150px;align-self:start;max-height:calc(100vh - 170px);overflow:auto;font-size:15px}
.sidenav h2{font-size:15px;margin:0 0 6px;color:var(--ink-2)}
.sidenav ol,.sidenav ul{list-style:none;margin:0 0 18px;padding:0}
.sidenav li{margin:2px 0}
.sidenav a{display:flex;justify-content:space-between;gap:6px;padding:3px 8px;border-radius:5px;text-decoration:none;color:var(--ink)}
.sidenav a:hover{background:var(--pen-soft)}
.sidenav .cnt{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
main{min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:30px 38px;margin-bottom:28px}
.sheet.unit{background-color:#fff;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.sheet>h2{font-size:24px;margin:0 0 12px}
.lead{color:var(--ink-2)}
.note{font-size:15px;color:var(--ink-2)}
.tag{display:inline-block;font-size:12.5px;line-height:1.55;padding:0 7px;border-radius:4px;border:1px solid currentColor;margin-right:4px;white-space:nowrap;font-family:var(--sans);font-weight:400}
.tag.must{color:#9a3412;background:#fff7ed}
.tag.exp{color:#a16207;background:#fefce8}
.tag.xk{color:#57534e;background:#f5f5f4}
.tag.new{color:#0e7490;background:#ecfeff}
.tag.outside{color:#155e75;background:#ecfeff}
.tag.method{color:#475569;background:#f1f5f9}
.tag.place{color:#92400e;background:#fffbeb}

/* 单元页 */
.unit-head{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;row-gap:4px;align-items:center;margin:-6px 0 6px;padding:14px 18px;border-radius:10px;background:var(--ut);border:2px solid var(--ub)}
.unit-head>.ptile{grid-row:1/span 2}
.uh-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px}
.unit-head h2{margin:0;font-size:28px;letter-spacing:.03em;color:var(--ink)}
.unit-head .book{color:var(--ink-2);font-size:14.5px}
.unit-head .bd{display:inline-block;color:#fff;background:var(--uc);border-radius:14px;padding:1px 12px;font-size:14px}
.ubar{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
.ubar .bar{flex:1;max-width:420px;height:10px;border-radius:5px;background:#e8eeed;overflow:hidden;display:flex}
.ubar .bar i{display:block;height:100%}
.batch{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--rule);border-radius:14px;background:#fff;color:var(--ink-2)}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:19px;margin:30px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--hl)}
.sec-h .kind{font:700 13px var(--sans);color:#fff;background:var(--hl);border-radius:4px;padding:1px 8px}
.sec-h .kind.k-exp{background:#a16207}.sec-h .kind.k-xk{background:#57534e}
.sec-h .sp{margin-left:auto}

/* 知识点 */
.kp{position:relative;background:#fff;border:1px solid var(--rule);border-radius:4px 10px 10px 4px;padding:28px 18px 10px 40px;margin:24px 0 14px;box-shadow:0 2px 6px rgba(80,50,20,.07)}
.kp::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:4px 0 0 4px;background:var(--t2)}
.kp::after{content:"";position:absolute;left:28px;top:0;bottom:0;border-left:2px solid var(--pen-line)}
.rec-tab{position:absolute;left:40px;top:-12px;font:700 12.5px var(--sans);color:var(--pen);background:var(--pen-soft);border:1px solid var(--pen-line);border-radius:6px;padding:1px 10px;line-height:1.6}
.kp[data-tier="必考"]::before{background:var(--t5)} .kp[data-tier="高频"]::before{background:var(--t4)}
.kp[data-tier="中频"]::before{background:var(--t3)}
.kp-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.kp-head h4{font-size:18.5px;margin:0}
.kp-meta{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:14.5px;color:var(--ink-2);margin:4px 0 6px;align-items:center}
.kp .core{margin:4px 0 6px;max-width:46em}
.status-pick{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--ink-2)}
.status-pick select{font:inherit;font-size:14px;padding:2px 8px;border:1px solid var(--rule);border-radius:14px;background:#fff;color:var(--ink)}
.st{display:inline-block;font-family:var(--sans);font-weight:400;font-size:12.5px;line-height:1.5;border:1px solid currentColor;border-radius:4px;padding:0 6px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.st[data-s="0"]{color:var(--ink-3)}
.st[data-s="1"]{color:#b45309;background:#fffbeb}
.st[data-s="2"]{color:#1d4ed8;background:#eef4ff}
.st[data-s="3"]{color:var(--ok);background:#f0fdf4}
.tier{font-weight:600}
.tier[data-t="必考"]{color:var(--t5)} .tier[data-t="高频"]{color:var(--t4)}
.tier[data-t="中频"]{color:var(--t3)} .tier[data-t="低频"]{color:var(--t2)}
.stars{color:#b7791f;letter-spacing:1px;white-space:nowrap}
.stars .off{color:#d6dbe2}
details.hits{max-width:46em;font-size:15px}
details.hits>summary{cursor:pointer;color:var(--pen);font-weight:600}
details.hits .hb{border:1px dashed var(--rule);border-radius:4px;padding:8px 14px;margin-top:6px;background:#fffdfa}
details.hits ul{margin:.2em 0;padding-left:1.2em}
.yr{font-family:var(--chem);font-weight:700;color:var(--ink);margin-right:4px}
.est{font-size:12.5px;color:#92400e;border:1px solid #f0d58a;background:#fffbeb;border-radius:3px;padding:0 4px;margin-left:4px}
.empty{display:none;color:var(--ink-3);padding:16px 0}
.unit[hidden]{display:none}

/* 表格 */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0 6px}
th,td{border:1px solid var(--rule);padding:6px 10px;text-align:left;vertical-align:top}
th{background:#fbf3ea;font-weight:600}

/* 高中衔接：另一种底色，默认隐藏 */
.bridge{display:none;background:var(--hs-bg);border:1px solid var(--hs-rule);border-left:5px solid var(--hs);border-radius:4px;padding:16px 22px;margin-top:34px}
body.show-hs .bridge{display:block}
.bridge h3{color:var(--hs);font-size:19px;margin:0 0 4px;border:0}
.bridge .b-item{border-top:1px solid var(--hs-rule);padding:10px 0 4px}
.bridge .b-item:first-of-type{border-top:0}
.bridge dl{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:3px 12px;margin:4px 0;font-size:15px}
.bridge dt{color:var(--hs)} .bridge dd{margin:0}
.fix{font-size:12.5px;color:#fff;background:var(--hs);border-radius:4px;padding:0 6px;margin-left:6px}
.hs-hint{font-size:14.5px;color:var(--hs);margin-top:24px}
body.show-hs .hs-hint{display:none}

/* 知识地图 */
.atlas{max-width:1880px;margin:22px auto 0;padding:0 20px}
.atlas-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;margin-bottom:10px}
.atlas-head h2{font-size:28px;margin:0;letter-spacing:.04em}
.atlas-head p{margin:0;color:var(--ink-2);font-size:15.5px}
.mm-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 8px}
.mm-hint{font-size:14px;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-right:6px}
.seg button{font:inherit;font-size:14px;border:0;background:#fff;padding:4px 12px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--pen);color:#fff}
.mm-stage{border:1px solid var(--rule);border-radius:4px;background:#fffdfa;overflow:hidden;touch-action:pan-x pan-y}
.mm.zoomed .mm-stage{cursor:grab;touch-action:none}
.mm.dragging .mm-stage{cursor:grabbing}
.mm-stage svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.mm-stage a{cursor:pointer}
.mm-stage a:hover text{text-decoration:underline}
.mm-focus .mm-g{opacity:.14;transition:opacity .15s}
.mm-focus .mm-g.on{opacity:1}
@media (prefers-reduced-motion:reduce){.mm-focus .mm-g{transition:none}}
.mm-full{position:fixed;inset:0;z-index:60;background:#fff;padding:10px 14px;display:flex;flex-direction:column}
.mm-full .mm-stage{flex:1;min-height:0}
.mm-full .mm-stage svg{height:100%}
html.mm-lock{overflow:hidden}
.mm-zoom{display:inline-flex;flex-wrap:wrap;gap:6px 8px}
.mm.is-list .map-only,.mm.is-list .mm-stage{display:none}
.mm:not(.is-list) .vm-stage{display:none}
.mm-node[data-bb]{cursor:zoom-in}
/* 竖版 */
.vmap{font-size:16px;line-height:1.5}
.vm-root{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:4px 12px;width:max-content;max-width:100%;margin:4px auto 16px;padding:8px 22px;border:2px solid var(--ink);border-radius:28px;background:#fff}
.vm-root b{font-family:var(--serif);font-size:24px}
.vm-root span{font-size:14px;color:var(--ink-3);letter-spacing:.2em}
.vm-board{background:var(--t);border:1.5px solid var(--tb);border-radius:18px;padding:12px 8px 10px 10px;margin:0 0 14px}
.vm-bhead{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:22px;background:var(--c);color:#fff;font:700 19px/1.4 var(--serif);padding:5px 16px 5px 9px;cursor:pointer}
.vm-bhead small{font:400 13px var(--sans);opacity:.9}
.vm-bhead::after{content:"";width:7px;height:7px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);margin:-4px 0 0 2px}
.vm-bhead[aria-expanded="false"]::after{transform:rotate(-45deg);margin:0}
.vm-icon{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vm-chaps{list-style:none;margin:0 0 0 20px;padding:0}
.vm-chap{position:relative;padding:6px 0 0 22px}
.vm-chap::before{content:"";position:absolute;left:0;top:0;width:18px;height:28px;border-left:3px solid var(--c);border-bottom:3px solid var(--c);border-bottom-left-radius:14px}
.vm-chap::after{content:"";position:absolute;left:0;top:22px;bottom:0;border-left:3px solid var(--c)}
.vm-chap:last-child::after{display:none}
.vm-crow{display:flex;align-items:center;gap:6px;min-height:44px}
.vm-cname{display:inline-flex;align-items:center;gap:8px;min-width:0;min-height:40px;background:var(--tp);border:2px solid var(--c);border-radius:22px;padding:3px 14px 3px 4px;color:var(--ink);text-decoration:none;font:700 17px/1.3 var(--serif)}
.vm-badge{width:32px;height:32px;flex:none}
.vm-badge text{font-family:var(--sans)}
.vm-dots{display:inline-flex;align-items:center;gap:3px;flex:none}
.vm-dots i{width:7px;height:7px;border-radius:50%;border:1.2px solid #c3ccd8;background:#fff}
.vm-dots i.on{background:var(--c);border-color:var(--c)}
.vm-dots b,.vm-legend b.q{color:var(--c,var(--ink-2));font-size:13px;margin-left:2px}
.vm-tog{flex:none;margin-left:auto;width:40px;height:40px;border:0;border-radius:50%;background:transparent;cursor:pointer;position:relative}
.vm-tog::before{content:"";position:absolute;left:15px;top:13px;width:8px;height:8px;border-right:2.4px solid var(--c);border-bottom:2.4px solid var(--c);transform:rotate(45deg)}
.vm-tog[aria-expanded="false"]::before{transform:rotate(-45deg);left:13px;top:16px}
.vm-secs{list-style:none;margin:2px 0 6px 19px;padding:0}
.vm-secs>li{position:relative;padding:2px 0 2px 18px}
.vm-secs>li::before{content:"";position:absolute;left:0;top:0;width:13px;height:19px;border-left:1.6px solid var(--l);border-bottom:1.6px solid var(--l);border-bottom-left-radius:9px}
.vm-secs>li::after{content:"";position:absolute;left:0;top:16px;bottom:0;border-left:1.6px solid var(--l)}
.vm-secs>li:last-child::after{display:none}
.vm-secs a{display:inline-block;padding:4px 0 2px;color:var(--ink);text-decoration:none;font-size:15.5px;border-bottom:1.6px solid var(--l)}
.vm-prac{font-size:12px;font-weight:700;color:#fff;background:var(--c);border-radius:3px;padding:0 4px;margin-right:6px}
.vm-prac.p-exp{background:#a16207}.vm-prac.p-xk{background:#57534e}
.vm-kps{list-style:none;margin:2px 0 4px 4px;padding:0}
.vm-kps a{display:flex;align-items:center;gap:7px;border:0;font-size:15px;padding:3px 0}
.vm-pie{width:16px;height:16px;flex:none;vertical-align:-3px}
.vm-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink-2);margin:4px 4px 2px}
.vm-legend>span{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px}
@keyframes flash{0%{background-color:#fff1b8}100%{background-color:transparent}}
.flash{animation:flash 1.8s ease-out}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid #f59e0b;outline-offset:2px}}
/* 使用指南 */
.guide-btn{border-color:var(--pen);color:var(--pen);font-weight:600}
dialog.guide{width:min(780px,calc(100vw - 24px));max-height:min(88vh,780px);padding:0;border:1px solid var(--rule);border-radius:10px;color:var(--ink)}
dialog.guide[open]{display:flex;flex-direction:column}
dialog.guide::backdrop{background:rgba(23,35,58,.4)}
.g-head{display:flex;align-items:center;gap:12px;padding:14px 14px 6px 22px}
.g-head h2{margin:0;font-size:22px;margin-right:auto}
.g-x{border:0;background:none;font-size:28px;line-height:1;width:40px;height:40px;border-radius:50%;color:var(--ink-3);cursor:pointer}
.g-x:hover{background:var(--paper)}
.g-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 22px 12px;border-bottom:1px solid var(--rule);scrollbar-width:thin}
.g-tabs button{flex:none;font:inherit;font-size:14px;line-height:1.6;border:1px solid var(--rule);background:#fff;border-radius:16px;padding:2px 12px;color:var(--ink-2);cursor:pointer}
.g-tabs button[aria-selected="true"]{background:var(--pen);border-color:var(--pen);color:#fff}
.g-body{flex:1;min-height:0;overflow:auto;padding:18px 24px 10px;font-size:16.5px}
.g-body:focus{outline:none}
.g-body h3{font-size:21px;margin:0 0 10px}
.g-body ul,.g-body ol{margin:.3em 0 .6em;padding-left:1.3em}
.g-body li{margin:7px 0}
.g-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 22px 16px;border-top:1px solid var(--rule)}
.g-pos{font-size:14px;color:var(--ink-3);margin-right:auto}
.g-foot .btn{font-size:15px;padding:6px 14px}
.btn.primary{background:var(--pen);border-color:var(--pen);color:#fff}
.btn.g-go{background:#fffbeb;border-color:#f59e0b;color:#92400e}
kbd.g-k{font:inherit;font-size:14px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:6px;padding:0 7px;background:#fff;white-space:nowrap}
.g-sample{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
@keyframes spot{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.55)}50%{box-shadow:0 0 0 10px rgba(245,158,11,0)}}
.spot{outline:3px solid #f59e0b!important;outline-offset:4px;border-radius:6px;animation:spot 1.1s ease-in-out 3}
@media (prefers-reduced-motion:reduce){.spot{animation:none}}
dialog.names{border:1px solid var(--rule);border-radius:6px;padding:20px 24px;max-width:26em}
dialog.names::backdrop{background:rgba(23,35,58,.35)}
dialog.names h2{font-size:19px;margin:0 0 6px}
dialog.names label{display:flex;align-items:center;gap:10px;margin:8px 0}
dialog.names input{font:inherit;font-size:16px;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;width:9em}
dialog.names .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
@media (max-width:620px){

<!-- ============ 数据层 0：化学用语排版小工具 ============ -->
<script>
/* 化学式：开头的数字是化学计量数（正常大小），字母或右括号后面的数字写成下标 */
const SUBF=s=>String(s).replace(/([A-Za-z\)])(\d+)/g,'$1<sub>$2</sub>');
const F=s=>{const m=/^(\d*)(.*)$/.exec(String(s));return `<span class="f">${m[1]}${SUBF(m[2])}</span>`;};
/* 离子：电荷写在右上角，数字在前、正负号在后 */
const I=(s,c)=>`<span class="f">${SUBF(s)}<sup>${c}</sup></span>`;
/* 化合价：写在元素正上方，正负号在前、数字在后 */
const V=(el,v)=>`<ruby class="val">${el}<rt>${v}</rt></ruby>`;
/* 自测遮挡 */
const M=s=>`<span class="mask" title="自测：点一下显示">${s}</span>`;
/* 化学方程式：条件写在等号上方（两个条件时第二个写在下方），生成物在自测模式下遮住 */
const E=(l,r,top,bot)=>{const side=x=>x.split(' + ').map(t=>`<span class="t">${F(t)}</span>`).join(' + ');
  return `<span class="eq">${side(l)}<span class="eqr"><span class="eqs" aria-label="${top||''}${bot?'，'+bot:''}"><span class="c">${top?SUBF(top):''}</span><span class="ln"></span><span class="c">${bot?SUBF(bot):''}</span></span>${M(side(r))}</span></span>`;};
</script>

<script>
window.KP={
"u1-k1":Object.assign({"u": 1, "name": "物理变化与化学变化", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（4 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "化学变化 物理变化", "short": "两种变化"},{core:`生成其他物质的变化叫做化学变化（又叫化学反应），没有生成其他物质的变化叫做物理变化。两者的本质区别是<b>有没有生成其他物质</b>。化学变化常伴随发光、放热、变色、放出气体、生成沉淀等现象，但有这些现象的不一定是化学变化（如灯泡发光）。`}),
"u1-k2":Object.assign({"u": 1, "name": "物理性质与化学性质；性质决定用途", "diff": "易", "tags": [], "place": false, "star": 2, "why": "★2：已确认的题目中未见，按低频处理", "kw": "物理性质 化学性质 用途", "short": "性质与用途"},{core:`物质在化学变化中表现出来的性质叫做化学性质（如可燃性、助燃性、稳定性）；不需要发生化学变化就表现出来的性质叫做物理性质（如颜色、状态、气味、密度、熔点、沸点、溶解性、导电性）。物质的性质决定用途，例如铜导电性好可作导线（物理性质），氮气化学性质不活泼可作保护气（化学性质）。`}),
"u1-k3":Object.assign({"u": 1, "name": "科学探究的基本环节", "diff": "易", "tags": [], "place": true, "star": 2, "why": "★2：已确认的题目中未见，按低频处理。这个知识点在新版课本中的归属课题待核对（ⓘ）", "kw": "科学探究 猜想 实验 结论", "short": "科学探究"},{core:`科学探究一般包括：提出问题、作出猜想与假设、设计实验、进行实验、收集证据、解释与结论、反思与评价、表达与交流。课本用对蜡烛及其燃烧等的探究来体会这些环节 ⓘ。描述实验时要分清<b>现象</b>（看到、闻到、摸到的）和<b>结论</b>（由现象推出的）。`}),
"u1-k4":Object.assign({"u": 1, "name": "药品的取用与量筒读数", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（4 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "取用 量筒 仰视 俯视 胶头滴管", "short": "药品取用"},{core:`固体：粉末用药匙或纸槽，块状用镊子，试管先横放再慢慢竖起。液体：瓶塞倒放，标签朝向手心，瓶口紧挨容器口；少量用胶头滴管，滴管垂直悬空在容器口上方。量筒读数时视线与凹液面的最低处保持水平；<b>仰视读数偏小、俯视读数偏大</b>（配制溶液时会造成误差）。`}),
"u1-k5":Object.assign({"u": 1, "name": "酒精灯的使用与给物质加热", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "酒精灯 外焰 加热 试管", "short": "酒精灯与加热"},{core:`用火柴点燃酒精灯，禁止用燃着的酒精灯去引燃另一盏；用灯帽盖灭，不可用嘴吹。给物质加热用<b>外焰</b>（温度最高）。给试管里的液体加热，液体不超过试管容积的 1/3，试管夹夹在离管口约 1/3 处，先预热再集中加热，管口不对着人。`}),
"u1-k6":Object.assign({"u": 1, "name": "闻气味、稀释浓硫酸、测 pH 等基本操作", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "闻气味 稀释浓硫酸 pH试纸 扇闻", "short": "基本操作"},{core:`闻气体气味用手在瓶口轻轻扇动，使少量气体飘进鼻孔。稀释浓硫酸时，<b>把浓硫酸沿器壁慢慢注入水中</b>，并用玻璃棒不断搅拌，切不可把水倒进浓硫酸里。测溶液 pH：用玻璃棒蘸取待测液滴到 pH 试纸上，与标准比色卡对照；试纸不能先用水润湿，也不能伸进待测液里。`}),
"u1-k7":Object.assign({"u": 1, "name": "仪器连接与检查装置气密性", "diff": "易", "tags": [], "place": false, "star": 2, "why": "★2：已确认的题目中未见，按低频处理", "kw": "气密性 仪器连接 橡胶塞", "short": "检查气密性"},{core:`连接仪器时，玻璃管口先用水润湿再旋转插入；塞橡胶塞时不能把试管抵在桌上用力塞。检查气密性：先把导管一端浸入水中，再用手紧握容器外壁，若导管口有气泡冒出，松手后导管内形成一段水柱，说明装置不漏气。制取气体前都要先检查气密性。`}),
"u2-k1":Object.assign({"u": 2, "name": "空气的成分及用途", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "空气 氮气 氧气 稀有气体 体积分数", "short": "空气成分"},{core:`按体积计算，空气中氮气约占 78%，氧气约占 21%，稀有气体约占 0.94%，二氧化碳约占 0.03%（体积分数，不是质量分数；新版课本的数值待核对 ⓘ）。氮气化学性质不活泼，可作保护气，也是制硝酸和化肥的原料；稀有气体通电发出不同颜色的光，可作电光源；氧气供给呼吸、支持燃烧。`}),
"u2-k2":Object.assign({"u": 2, "name": "测定空气中氧气的含量", "diff": "中", "tags": [], "place": false, "star": 2, "why": "★2：已确认的题目中未见，按低频处理", "kw": "红磷 五分之一 止水夹", "short": "测氧气含量"},{core:`用红磷在密闭集气瓶中燃烧消耗氧气（${E('4P + 5O2','2P2O5','点燃')}），产生${M('大量白烟')}；冷却到室温后打开止水夹，进入集气瓶的水约占瓶内空气体积的 1/5。测得结果偏小的常见原因：红磷量不足、装置漏气、没冷却就打开止水夹。不能用木炭、硫代替红磷，因为它们燃烧生成气体。`}),
"u2-k3":Object.assign({"u": 2, "name": "纯净物与混合物", "diff": "易", "tags": [], "place": true, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题。这个知识点在新版课本中的归属课题待核对（ⓘ）", "kw": "纯净物 混合物 冰水", "short": "纯净物与混合物"},{core:`由一种物质组成的是纯净物（可以用一个化学式表示，如 ${F('O2')}、${F('H2O')}）；由两种或两种以上物质混合而成的是混合物（如空气、海水、溶液）。冰和水是同一种物质，<b>冰水共存物是纯净物</b>。新版首次出现的课题待课本核对 ⓘ。`}),
"u2-k4":Object.assign({"u": 2, "name": "空气污染与防治", "diff": "易", "tags": [], "place": false, "star": 2, "why": "★2：已确认的题目中未见，按低频处理", "kw": "空气污染 二氧化硫 PM2.5 空气质量指数", "short": "空气污染"},{core:`计入空气质量评价的主要污染物有二氧化硫、一氧化碳、二氧化氮、臭氧、可吸入颗粒物和细颗粒物（PM2.5）等。二氧化碳不计入空气污染物，但它增多会加剧温室效应。防治措施：使用清洁能源、工厂废气处理后排放、植树造林等。`}),
"u2-k5":Object.assign({"u": 2, "name": "氧气的性质与常见物质在氧气中的燃烧", "diff": "中", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "氧气 木炭 硫 铁丝 红磷 燃烧现象 助燃", "short": "氧气的性质"},{core:`氧气不易溶于水，密度比空气略大；化学性质比较活泼，能支持燃烧（有助燃性，本身不可燃）。木炭在氧气中燃烧${M('发出白光，生成使澄清石灰水变浑浊的气体')}；硫在氧气中燃烧${M('发出明亮的蓝紫色火焰，生成有刺激性气味的气体')}；铁丝在氧气中${M('剧烈燃烧、火星四射，生成黑色固体')}（瓶底预先放少量水或细沙）：${E('3Fe + 2O2','Fe3O4','点燃')}。`}),
"u2-k6":Object.assign({"u": 2, "name": "化合反应与氧化反应", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "化合反应 氧化反应 缓慢氧化", "short": "化合与氧化"},{core:`由两种或两种以上物质生成另一种物质的反应叫做化合反应（“多变一”），如 ${E('C + O2','CO2','点燃')}。物质与氧发生的反应叫做氧化反应（初中的说法），有的很剧烈（燃烧），有的很缓慢（呼吸、食物腐烂、铁生锈，叫缓慢氧化）。化合反应不一定是氧化反应，氧化反应也不一定是化合反应。`}),
"u2-k7":Object.assign({"u": 2, "name": "实验室制取氧气：原理、装置、收集与检验", "diff": "中", "tags": ["must"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容；近 5 年有 5 年出现在第 20–25 题（2022、2023、2024、2025、2026）", "kw": "制取氧气 过氧化氢 高锰酸钾 氯酸钾 排水法 验满", "short": "制取氧气"},{core:`三种方法：${E('2H2O2','2H2O + O2↑','MnO2')}；${E('2KMnO4','K2MnO4 + MnO2 + O2↑','△')}；${E('2KClO3','2KCl + 3O2↑','MnO2','△')}。固体加热选“试管口略向下倾斜”的装置，固液常温选锥形瓶加长颈漏斗或分液漏斗。氧气不易溶于水，可用排水法收集；密度比空气大，可用向上排空气法收集。检验：带火星的木条伸入瓶内复燃；验满：放在<b>瓶口</b>复燃。`}),
"u2-k8":Object.assign({"u": 2, "name": "催化剂", "diff": "易", "tags": [], "place": false, "star": 2, "why": "★2：已确认的题目中未见，按低频处理", "kw": "催化剂 二氧化锰 催化作用", "short": "催化剂"},{core:`在化学反应里能改变其他物质的化学反应速率，而本身的<b>质量和化学性质</b>在反应前后都没有发生变化的物质叫做催化剂。“改变”既可以是加快也可以是减慢；催化剂不能增加生成物的质量。过氧化氢分解中二氧化锰是催化剂。`}),
"u2-k9":Object.assign({"u": 2, "name": "分解反应", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "分解反应 一变多", "short": "分解反应"},{core:`由一种反应物生成两种或两种以上其他物质的反应叫做分解反应（“一变多”），如过氧化氢、高锰酸钾分解制氧气，电解水。与化合反应同属基本反应类型。`}),
"u2-e1":Object.assign({"u": 2, "name": "氧气的实验室制取与性质", "diff": "中", "tags": ["must", "exp"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容；近 5 年有 5 年出现在第 20–25 题（2022、2023、2024、2025、2026）", "kw": "实验活动1 制取氧气 必做实验", "short": "制氧与性质"},{core:`课标必做实验。要点：检查气密性→装药品→固定→加热或加液体→收集→检验。用高锰酸钾时试管口塞一团棉花；排水法收集时，导管口有<b>连续均匀</b>的气泡冒出再收集，结束时<b>先把导管移出水面，再熄灭酒精灯</b>（防止水倒吸使试管炸裂）。再用收集的氧气做木炭、铁丝等燃烧实验。`}),
"u2-x1":Object.assign({"u": 2, "name": "微型空气质量“检测站”的组装与使用", "diff": "易", "tags": ["xk", "new"], "place": false, "star": 1, "why": "跨学科实践活动：近 5 年河南卷未见设问，按规则给 ★1", "kw": "跨学科实践活动1 空气质量 检测", "short": "空气检测站"},{core:`跨学科实践：用传感器等组装简易检测装置，测量 PM2.5、二氧化硫等，结合空气质量指数评价空气质量。相关知识：空气的成分、空气污染物、防治措施。`}),
"u3-k1":Object.assign({"u": 3, "name": "分子的基本性质", "diff": "易", "tags": [], "place": false, "star": 5, "why": "★5：近 5 年有 4 年出现在第 20–25 题（2022、2023、2024、2025）", "kw": "分子运动 分子间隔 扩散", "short": "分子的性质"},{core:`分子的质量和体积都很小；分子总在不断地运动（温度越高运动越快）；分子之间有间隔（气体分子间隔较大，容易被压缩）。用来解释：闻到气味（分子运动）、热胀冷缩和气体可压入钢瓶（间隔变化）。理化交叉：物理第十三章学过分子热运动和扩散，两科说法一致。`}),
"u3-k2":Object.assign({"u": 3, "name": "分子与原子；化学变化的微观实质", "diff": "中", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（1 年）", "kw": "分子 原子 化学变化实质", "short": "化学变化实质"},{core:`由分子构成的物质，分子是保持其化学性质的最小粒子；原子是化学变化中的最小粒子。化学变化的实质：<b>分子分成原子，原子重新组合成新的分子</b>。物理变化中分子本身不变。同种分子化学性质相同，不同种分子化学性质不同。`}),
"u3-k3":Object.assign({"u": 3, "name": "构成物质的微粒：分子、原子、离子", "diff": "中", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（4 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "构成物质 分子 原子 离子 氯化钠", "short": "构成物质的微粒"},{core:`有的物质由分子构成（如 ${F('H2O')}、${F('O2')}、${F('CO2')}），有的由原子直接构成（金属、稀有气体、金刚石和石墨等），有的由离子构成（如氯化钠由 ${I('Na','+')} 和 ${I('Cl','−')} 构成，硫酸铜由 ${I('Cu','2+')} 和 ${I('SO4','2−')} 构成）。`}),
"u3-k4":Object.assign({"u": 3, "name": "原子的构成与原子结构示意图", "diff": "中", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "原子核 质子 中子 电子 原子结构示意图 最外层电子", "short": "原子结构"},{core:`原子由居于中心的原子核和核外电子构成，原子核由质子和中子构成（有一种氢原子没有中子）。在原子中，<b>核电荷数 = 质子数 = 核外电子数</b>，原子不显电性。原子结构示意图中，圆圈内是质子数，弧线表示电子层。最外层电子数决定元素的化学性质：金属原子最外层一般少于 4 个、易失电子；非金属原子一般多于 4 个、易得电子；稀有气体为 8 个（氦为 2 个），相对稳定。`}),
"u3-k5":Object.assign({"u": 3, "name": "离子与离子符号", "diff": "中", "tags": [], "place": false, "star": 2, "why": "★2：已确认的题目中未见，按低频处理", "kw": "离子 阳离子 阴离子 离子符号", "short": "离子"},{core:`带电的原子或原子团叫做离子。原子失去电子成为阳离子，得到电子成为阴离子。离子符号：在元素符号右上角标出所带电荷，<b>数字在前、正负号在后</b>，电荷数为 1 时省略 1，如 ${I('Na','+')}、${I('Mg','2+')}、${I('Cl','−')}、${I('SO4','2−')}。离子符号前的数字表示离子个数（如 2${I('OH','−')}）。`}),
"u3-k6":Object.assign({"u": 3, "name": "相对原子质量", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "相对原子质量 碳12", "short": "相对原子质量"},{core:`以一种碳原子质量的 1/12 为标准，其他原子的质量跟它相比较所得的比，就是这种原子的相对原子质量。它是一个比值，<b>单位是“1”，一般不写，不是“g”</b>。相对原子质量 ≈ 质子数 + 中子数。我国科学家张青莲为测定相对原子质量作出了卓越贡献。`}),
"u3-k7":Object.assign({"u": 3, "name": "元素与元素符号；地壳中的元素", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "元素 元素符号 地壳 氧 硅 铝 铁", "short": "元素"},{core:`元素是质子数（即核电荷数）相同的一类原子的总称，元素的种类由质子数决定。元素符号表示一种元素和这种元素的一个原子（由原子构成的物质，还表示这种物质）；符号前加数字只表示原子个数。地壳中含量居前四位的元素是氧、硅、铝、铁；含量最多的金属元素是铝。`}),
"u3-k8":Object.assign({"u": 3, "name": "元素周期表", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "元素周期表 原子序数 门捷列夫", "short": "元素周期表"},{core:`门捷列夫发现了元素周期律并编制了元素周期表。周期表每一格中有原子序数、元素符号、元素名称、相对原子质量；<b>原子序数 = 质子数</b>。根据名称偏旁可判断金属（“钅”，汞除外）或非金属元素。`}),
"u3-x1":Object.assign({"u": 3, "name": "制作模型并展示科学家探索物质组成与结构的历程", "diff": "易", "tags": ["xk", "new"], "place": false, "star": 2, "why": "跨学科实践活动：近 5 年河南卷用它作过情境或设问（具体设问记在对应知识点上），按规则给 ★2", "kw": "跨学科实践活动2 原子模型 道尔顿 汤姆孙 卢瑟福", "short": "模型与历程"},{core:`跨学科实践：制作分子、原子模型，梳理道尔顿、汤姆孙、卢瑟福等科学家探索原子结构的历程，体会模型方法。相关知识：分子和原子、原子结构。`}),
"u4-k1":Object.assign({"u": 4, "name": "水资源与水污染防治", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（1 年）", "kw": "淡水资源 水污染 节约用水", "short": "水资源"},{core:`地球上水储量大，但可利用的淡水很少。爱护水资源：一方面节约用水，另一方面防治水体污染——工业废水处理达标后排放，农业上合理使用化肥和农药，生活污水集中处理后排放。`}),
"u4-k2":Object.assign({"u": 4, "name": "水的净化", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（1 年）", "kw": "沉淀 过滤 吸附 蒸馏 活性炭 明矾 一贴二低三靠", "short": "水的净化"},{core:`常用净水方法：沉淀（可加明矾使悬浮杂质沉降）、过滤（除去不溶性杂质，操作要点“一贴、二低、三靠”）、吸附（活性炭除去色素和异味）、蒸馏（净化程度最高）。投药消毒是化学变化，其余三种主要是物理变化。`}),
"u4-k3":Object.assign({"u": 4, "name": "硬水与软水", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "硬水 软水 肥皂水 煮沸", "short": "硬水与软水"},{core:`含有较多可溶性钙、镁化合物的水叫做硬水。用<b>肥皂水</b>区分：泡沫少、浮渣多的是硬水。生活中常用煮沸、实验室常用蒸馏的方法降低水的硬度。`}),
"u4-k4":Object.assign({"u": 4, "name": "电解水与水的组成", "diff": "中", "tags": ["must"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容", "kw": "电解水 正氧负氢 1:2 水的组成", "short": "电解水"},{core:`${E('2H2O','2H2↑ + O2↑','通电')}。与电源负极相连的管内产生${M('氢气')}，正极产生${M('氧气')}，体积比约为 ${M('2 : 1')}（“正氧负氢，氢二氧一”）；氢气能燃烧，氧气能使带火星的木条复燃。结论：水是由氢元素和氧元素组成的。氢气燃烧生成水，也能证明水的组成。`}),
"u4-k5":Object.assign({"u": 4, "name": "氢气的性质", "diff": "易", "tags": [], "place": true, "star": 2, "why": "★2：已确认的题目中未见（只有估计的题目），按低频处理。这个知识点在新版课本中的归属课题待核对（ⓘ）", "kw": "氢气 可燃性 验纯 淡蓝色火焰", "short": "氢气"},{core:`氢气是最轻的气体，难溶于水。氢气具有可燃性，在空气中燃烧产生${M('淡蓝色火焰')}：${E('2H2 + O2','2H2O','点燃')}。氢气与空气混合点燃可能爆炸，<b>点燃前必须检验纯度</b>。新版归属课题待核对 ⓘ。`}),
"u4-k6":Object.assign({"u": 4, "name": "单质、化合物、氧化物", "diff": "易", "tags": [], "place": true, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题。这个知识点在新版课本中的归属课题待核对（ⓘ）", "kw": "单质 化合物 氧化物 物质分类", "short": "单质化合物氧化物"},{core:`由同种元素组成的纯净物叫做单质（如 O<sub>2</sub>、Fe）；由不同种元素组成的纯净物叫做化合物（如 H<sub>2</sub>O、NaCl）；由两种元素组成、其中一种是氧元素的化合物叫做氧化物（如 CO<sub>2</sub>、Fe<sub>2</sub>O<sub>3</sub>）。由同种元素组成的物质不一定是单质（如氧气和臭氧的混合物）。新版归属课题待核对 ⓘ。`}),
"u4-k7":Object.assign({"u": 4, "name": "化学式的意义与书写", "diff": "中", "tags": [], "place": false, "star": 4, "why": "人工调整：化学式是化学方程式书写（★5）的前提；单独设问的年份不多，按考频只到中频，这里提到 ★4", "kw": "化学式 书写 意义", "short": "化学式"},{core:`化学式表示一种物质及其元素组成；由分子构成的物质，化学式还表示一个分子及其原子构成。书写：金属、稀有气体和部分固态非金属用元素符号表示（Fe、He、C）；氧气、氮气、氢气、氯气等写成 ${F('O2')}、${F('N2')}、${F('H2')}、${F('Cl2')}；化合物一般正价在左、负价在右，再按化合价代数和为零确定原子个数，如 ${F('Al2O3')}。`}),
"u4-k8":Object.assign({"u": 4, "name": "化合价", "diff": "中", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（4 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "化合价 代数和为零 原子团", "short": "化合价"},{core:`化合物中各元素正、负化合价的代数和为零；单质中元素的化合价为 0。化合价标在元素符号<b>正上方</b>，<b>正负号在前、数字在后</b>，如 ${V('Fe','+3')}<sub>2</sub>O<sub>3</sub> 表示氧化铁中铁为 +3 价（与离子符号的写法相反）。常见原子团：${F('SO4')}（−2）、${F('CO3')}（−2）、${F('NO3')}（−1）、OH（−1）、${F('NH4')}（+1）。例：NaClO 中氯为 +1 价。`}),
"u4-k9":Object.assign({"u": 4, "name": "根据化学式的计算", "diff": "中", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（1 年）", "kw": "相对分子质量 元素质量比 元素质量分数", "short": "化学式计算"},{core:`相对分子质量 = 各原子的相对原子质量 × 原子个数之和，如 ${F('H2O')} 为 18。元素质量比 = 各元素的相对原子质量 × 原子个数之比，如 ${F('NH3')} 中氮、氢的质量比为 14 : 3。元素的质量分数 = 该元素的相对原子质量 × 原子个数 ÷ 相对分子质量 × 100%。`}),
"u4-e1":Object.assign({"u": 4, "name": "水的组成及变化的探究", "diff": "中", "tags": ["must", "exp", "new"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容", "kw": "实验活动2 电解水 必做实验", "short": "水的组成探究"},{core:`课标必做实验（新版新增的实验活动）。电解水时可加入少量硫酸钠或氢氧化钠增强导电性；用燃着的木条检验负极气体（能燃烧），用带火星的木条检验正极气体（复燃）。也可从氢气燃烧生成水的角度认识水的组成。`}),
"u4-x1":Object.assign({"u": 4, "name": "水质检测及自制净水器", "diff": "易", "tags": ["xk", "new"], "place": false, "star": 2, "why": "跨学科实践活动：近 5 年河南卷用它作过情境或设问（具体设问记在对应知识点上），按规则给 ★2", "kw": "跨学科实践活动3 净水器 水质", "short": "自制净水器"},{core:`跨学科实践：检测水的 pH、硬度等指标，用小卵石、石英砂、活性炭、蓬松棉等制作简易净水器。相关知识：过滤、吸附、硬水与软水。`}),
"u5-k1":Object.assign({"u": 5, "name": "质量守恒定律及其微观解释", "diff": "中", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "质量守恒定律 原子守恒 元素守恒", "short": "质量守恒"},{core:`参加化学反应的各物质的质量总和，等于反应后生成的各物质的质量总和。微观原因：反应前后原子的<b>种类、数目、质量</b>都不变；宏观上元素的种类和质量也不变（分子种类一定改变）。验证时，有气体参加或生成的反应要在密闭容器中进行。应用：推断未知物的化学式、推断物质的元素组成。`}),
"u5-k2":Object.assign({"u": 5, "name": "微观反应示意图", "diff": "中", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "微观示意图 分子个数比 质量比", "short": "微观示意图"},{core:`读图步骤：① 看图例，写出每种分子的化学式；② 去掉反应前后都有的、没参加反应的分子；③ 写出化学方程式并配平；④ 再回答分子个数比、质量比、物质类别、化合价变化等问题。`}),
"u5-k3":Object.assign({"u": 5, "name": "化学方程式的意义与书写", "diff": "中", "tags": [], "place": false, "star": 5, "why": "★5：化学方程式书写或根据化学方程式的计算", "kw": "化学方程式 配平 反应条件 气体符号 沉淀符号", "short": "方程式书写"},{core:`书写原则：以客观事实为依据，遵守质量守恒定律。步骤：写化学式→配平→注明条件（点燃、△、通电、高温、催化剂）→标 ↑ ↓。反应物中没有气体而生成物中有气体，气体后标 ↑；溶液中的反应生成沉淀，沉淀后标 ↓。如 ${E('CaCO3 + 2HCl','CaCl2 + H2O + CO2↑')}。条件和等号的写法以课本为准 ⓘ。`}),
"u5-k4":Object.assign({"u": 5, "name": "根据化学方程式的计算", "diff": "中", "tags": [], "place": false, "star": 5, "why": "★5：化学方程式书写或根据化学方程式的计算；近 5 年有 3 年出现在第 20–25 题（2023、2024、2025）", "kw": "方程式计算 设 写 找 列 求 答", "short": "方程式计算"},{core:`步骤：设未知量→写方程式→找出相关物质的相对质量和已知量、未知量→列比例式→求解→答。代入的必须是<b>纯净物</b>的质量（混合物要先乘纯度，溶液要先乘溶质质量分数）。例：${E('2H2O2','2H2O + O2↑','MnO2')}，68 份质量的过氧化氢生成 32 份质量的氧气，所以 3.4 g 过氧化氢完全分解生成 1.6 g 氧气。`}),
"u5-k5":Object.assign({"u": 5, "name": "混合物计算方法：守恒法、极值法、平均值法", "diff": "难", "tags": ["method"], "place": false, "star": 4, "why": "★4：考频高频（4 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "计算方法 守恒 极值 平均值 第14题", "short": "计算方法"},{core:`解题方法，非课标条目。<b>守恒法</b>：抓住某种元素反应前后质量不变（如碳元素、硫酸根）。<b>极值法</b>：假设混合物全是其中一种，算出两个极端值，真实值在两者之间。<b>平均值法</b>：混合物的“平均”值一定介于两种成分之间，用来判断可能或不可能的组成。河南卷第 14 题常考。`}),
"u5-x1":Object.assign({"u": 5, "name": "基于特定需求设计和制作简易供氧器", "diff": "易", "tags": ["xk", "new"], "place": false, "star": 2, "why": "跨学科实践活动：近 5 年河南卷用它作过情境或设问（具体设问记在对应知识点上），按规则给 ★2", "kw": "跨学科实践活动4 供氧器 制氧剂", "short": "简易供氧器"},{core:`跨学科实践：根据使用场景选择制氧原理（如过氧化氢分解），设计反应仓、加湿净化仓等，评价供氧器的安全性和效果。相关知识：实验室制取氧气、气体的净化。`}),
"u6-k1":Object.assign({"u": 6, "name": "碳单质的结构、性质与用途", "diff": "中", "tags": [], "place": false, "star": 5, "why": "★5：近 5 年有 3 年出现在第 20–25 题（2023、2024、2025）", "kw": "金刚石 石墨 C60 活性炭 吸附 还原性", "short": "碳单质"},{core:`金刚石、石墨、C<sub>60</sub> 都由碳元素组成，因为<b>碳原子排列方式不同</b>，物理性质差别很大：金刚石最硬（切割玻璃、钻探），石墨软、能导电（电极、铅笔芯）。活性炭、木炭疏松多孔，有吸附性。碳在常温下化学性质稳定（古字画能长久保存）；有可燃性；有还原性：${E('C + 2CuO','2Cu + CO2↑','高温')}。石墨变成金刚石是化学变化。`}),
"u6-k2":Object.assign({"u": 6, "name": "二氧化碳的性质与用途", "diff": "中", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "二氧化碳 石灰水 碳酸 灭火 干冰", "short": "二氧化碳"},{core:`二氧化碳密度比空气大，能溶于水，不能燃烧也不支持燃烧。与水反应：${E('CO2 + H2O','H2CO3')}（碳酸使紫色石蕊溶液变${M('红')}，碳酸不稳定易分解）；与石灰水反应：${E('CO2 + Ca(OH)2','CaCO3↓ + H2O')}，石灰水${M('变浑浊')}，用来检验二氧化碳。用途：灭火、干冰用于人工降雨和制冷、气体肥料、化工原料。`}),
"u6-k3":Object.assign({"u": 6, "name": "温室效应与低碳生活", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "温室效应 低碳 碳中和", "short": "温室效应"},{core:`大气中二氧化碳等气体增多使温室效应增强，全球变暖。措施：减少化石燃料的使用、开发利用清洁能源、大力植树造林、捕集和利用二氧化碳。“低碳”中的“碳”指二氧化碳。`}),
"u6-k4":Object.assign({"u": 6, "name": "一氧化碳的性质；CO 与 CO₂ 的鉴别和除杂", "diff": "中", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "一氧化碳 毒性 还原性 鉴别 除杂", "short": "一氧化碳"},{core:`一氧化碳难溶于水；有可燃性，燃烧发出${M('蓝色火焰')}：${E('2CO + O2','2CO2','点燃')}；有还原性：${E('CO + CuO','Cu + CO2','△')}；<b>有毒</b>，能与血液中的血红蛋白结合。鉴别 CO 和 CO<sub>2</sub>：通入澄清石灰水、用燃着的木条等。除去 CO<sub>2</sub> 中的 CO：通过灼热的氧化铜（不能点燃）。`}),
"u6-k5":Object.assign({"u": 6, "name": "二氧化碳的实验室制取；制取气体的一般思路", "diff": "中", "tags": ["must"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容；近 5 年有 3 年出现在第 20–25 题（2023、2024、2025）", "kw": "制取二氧化碳 大理石 稀盐酸 向上排空气法 验满", "short": "制取二氧化碳"},{core:`原理：${E('CaCO3 + 2HCl','CaCl2 + H2O + CO2↑')}（大理石或石灰石与稀盐酸）。不用稀硫酸（生成微溶的硫酸钙覆盖在表面，反应停止）、不用浓盐酸（易挥发）。固液常温型发生装置；能溶于水、密度比空气大，用向上排空气法收集。检验：通入澄清石灰水；验满：燃着的木条放在<b>瓶口</b>熄灭。一般思路：按反应物状态和条件选发生装置，按气体密度和溶解性选收集装置。`}),
"u6-e1":Object.assign({"u": 6, "name": "二氧化碳的实验室制取与性质", "diff": "中", "tags": ["must", "exp"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容；近 5 年有 3 年出现在第 20–25 题（2023、2024、2025）", "kw": "实验活动3 制取二氧化碳 必做实验", "short": "CO₂制取与性质"},{core:`课标必做实验。连接装置→检查气密性→先加大理石再加稀盐酸→收集→验满→做性质实验（倾倒二氧化碳使阶梯蜡烛由低到高熄灭；通入紫色石蕊溶液；通入澄清石灰水）。长颈漏斗下端要伸到液面以下（液封）。`}),
"u6-x1":Object.assign({"u": 6, "name": "基于碳中和理念设计低碳行动方案", "diff": "易", "tags": ["xk", "new"], "place": false, "star": 2, "why": "跨学科实践活动：近 5 年河南卷用它作过情境或设问（具体设问记在对应知识点上），按规则给 ★2", "kw": "跨学科实践活动5 碳中和 低碳", "short": "低碳方案"},{core:`跨学科实践：了解碳循环与碳中和，调查个人和家庭的碳排放，从减少排放、增加吸收、捕集利用等方面设计低碳行动方案。相关知识：二氧化碳的性质、温室效应。`}),
"u7-k1":Object.assign({"u": 7, "name": "燃烧的条件", "diff": "中", "tags": ["must"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容；近 5 年有 4 年出现在第 20–25 题（2022、2023、2024、2025）", "kw": "燃烧条件 着火点 白磷 红磷", "short": "燃烧条件"},{core:`燃烧需要同时满足三个条件：① 可燃物；② 与氧气（或空气）接触；③ 温度达到可燃物的着火点。探究时用对比实验：铜片上的白磷燃烧而红磷不燃烧，说明需要温度达到着火点；铜片上的白磷燃烧而热水中的白磷不燃烧，说明需要与氧气接触。`}),
"u7-k2":Object.assign({"u": 7, "name": "灭火的原理和方法", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（1 年）", "kw": "灭火 隔绝氧气 降温 清除可燃物", "short": "灭火"},{core:`灭火原理是破坏燃烧条件中的任意一个：清除或隔离可燃物（关闭燃气阀门）；隔绝氧气或空气（盖上锅盖、用灯帽盖灭酒精灯）；使温度降到着火点以下（用水浇）。着火点是物质本身的属性，一般不能说“降低着火点”。`}),
"u7-k3":Object.assign({"u": 7, "name": "易燃物和易爆物的安全；危险化学品标志", "diff": "易", "tags": [], "place": true, "star": 3, "why": "★3：考频中频（2 年）。这个知识点在新版课本中的归属课题待核对（ⓘ）", "kw": "易燃 易爆 爆炸 危险化学品标志", "short": "易燃易爆"},{core:`可燃性气体或粉尘与空气混合，遇明火可能发生爆炸，所以加油站、面粉厂要严禁烟火，可燃性气体点燃前要验纯。要认识常见的危险化学品标志（易燃液体、腐蚀品、有毒品等），如装运汽油、乙醇的车辆贴“易燃液体”标志。新版归属课题待核对（也可能在第一单元）ⓘ。`}),
"u7-k4":Object.assign({"u": 7, "name": "化学反应中的能量变化", "diff": "易", "tags": [], "place": false, "star": 2, "why": "★2：已确认的题目中未见，按低频处理", "kw": "放热 吸热 能量变化 生石灰", "short": "能量变化"},{core:`化学反应在生成新物质的同时，常伴随能量变化，表现为放热或吸热。燃烧放热；生石灰与水反应放出大量的热：${E('CaO + H2O','Ca(OH)2')}；碳与二氧化碳在高温下的反应吸热。人类利用的能量大多来自化学反应。`}),
"u7-k5":Object.assign({"u": 7, "name": "化石燃料；甲烷的燃烧", "diff": "中", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "煤 石油 天然气 甲烷 不可再生 充分燃烧", "short": "化石燃料"},{core:`煤、石油、天然气是化石燃料，属于不可再生能源。煤主要含碳元素；石油主要含碳、氢元素，利用各成分沸点不同可将石油炼制出汽油、柴油等（物理变化）；天然气主要成分是甲烷：${E('CH4 + 2O2','CO2 + 2H2O','点燃')}。使燃料充分燃烧：供给足够的空气、增大燃料与空气的接触面积。`}),
"u7-k6":Object.assign({"u": 7, "name": "燃料燃烧对环境的影响；酸雨", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "酸雨 二氧化硫 二氧化氮 尾气", "short": "燃料与环境"},{core:`煤燃烧会产生二氧化硫、二氧化氮等，溶于雨水形成酸雨（pH 小于 5.6），腐蚀建筑、危害农作物。汽车尾气含一氧化碳、氮的氧化物等。措施：燃煤脱硫、使用清洁能源、汽车尾气用催化装置处理（如 ${E('2CO + 2NO','N2 + 2CO2','催化剂')}）。`}),
"u7-k7":Object.assign({"u": 7, "name": "新能源：氢能、乙醇等", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "氢能 乙醇 可再生能源 太阳能", "short": "新能源"},{core:`氢气燃烧产物只有水，热值高，是最理想的清洁燃料，但制取成本高、贮存和运输困难。乙醇可由粮食发酵制得，是可再生能源：${E('C2H5OH + 3O2','2CO2 + 3H2O','点燃')}。正在开发利用的新能源还有太阳能、风能、地热能、潮汐能、生物质能、核能等。`}),
"u7-e1":Object.assign({"u": 7, "name": "燃烧条件的探究", "diff": "中", "tags": ["must", "exp"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容；近 5 年有 4 年出现在第 20–25 题（2022、2023、2024、2025）", "kw": "实验活动4 燃烧条件 必做实验 白磷", "short": "燃烧条件探究"},{core:`课标必做实验。用白磷、红磷、热水、铜片等设计对比实验，分别控制“是否与氧气接触”“温度是否达到着火点”，每次只改变一个条件。改进装置常用密闭或微型装置，防止五氧化二磷污染空气。`}),
"u7-x1":Object.assign({"u": 7, "name": "调查家用燃料的变迁与合理使用", "diff": "易", "tags": ["xk", "new"], "place": false, "star": 2, "why": "跨学科实践活动：近 5 年河南卷用它作过情境或设问（具体设问记在对应知识点上），按规则给 ★2", "kw": "跨学科实践活动6 家用燃料 天然气 煤", "short": "家用燃料"},{core:`跨学科实践：调查家用燃料从柴草、煤到液化石油气、天然气的变迁，比较热值、污染和安全性，提出合理使用燃料的建议。相关知识：燃烧条件、化石燃料、燃料燃烧对环境的影响。`}),
"u8-k1":Object.assign({"u": 8, "name": "金属的物理性质与用途", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "金属光泽 导电性 导热性 延展性 年产量 铁 铝", "short": "金属物理性质"},{core:`常温下金属大多是固体（汞是液体），有金属光泽，大多为银白色（铜呈${M('紫红色')}，金呈${M('黄色')}），有良好的导电性、导热性和延展性。物质的用途主要由性质决定，还要考虑价格、资源、美观、是否便于回收和对环境的影响。铁是年产量最高的金属。`}),
"u8-k2":Object.assign({"u": 8, "name": "合金", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（4 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "合金 生铁 钢 黄铜 硬度 熔点", "short": "合金"},{core:`在金属中加热熔合某些金属或非金属，制得的具有金属特征的物质叫做合金。合金的硬度一般比各成分金属大，熔点一般比各成分金属低，抗腐蚀性更好。生铁和钢是含碳量不同的两种铁合金。合金属于<b>金属材料</b>，不是合成材料。比较硬度可把两块金属片相互刻画。`}),
"u8-k3":Object.assign({"u": 8, "name": "金属与氧气的反应", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "铝 氧化膜 抗腐蚀 镁 铜 真金不怕火炼", "short": "金属与氧气"},{core:`镁、铝在常温下就能与氧气反应：${E('4Al + 3O2','2Al2O3')}，铝表面生成<b>致密的氧化铝薄膜</b>，阻止内部铝进一步氧化，所以铝抗腐蚀。铜在加热时反应，${M('红色变黑色')}：${E('2Cu + O2','2CuO','△')}。金在高温下也不与氧气反应（“真金不怕火炼”）。`}),
"u8-k4":Object.assign({"u": 8, "name": "金属与稀盐酸、稀硫酸的反应", "diff": "中", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（4 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "金属与酸 氢气 浅绿色 亚铁", "short": "金属与酸"},{core:`在金属活动性顺序里，位于氢前面的金属能置换出稀盐酸、稀硫酸中的氢：${E('Zn + H2SO4','ZnSO4 + H2↑')}；${E('Fe + 2HCl','FeCl2 + H2↑')}（溶液变${M('浅绿色')}，铁生成+2价的亚铁盐）；${E('Mg + 2HCl','MgCl2 + H2↑')}。反应越剧烈，金属越活泼。`}),
"u8-k5":Object.assign({"u": 8, "name": "金属与盐溶液的反应；金属活动性顺序", "diff": "中", "tags": ["must"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容；近 5 年有 4 年出现在第 20–25 题（2022、2023、2024、2025）", "kw": "金属活动性顺序 置换 硫酸铜 硝酸银 湿法炼铜", "short": "活动性顺序"},{core:`常见金属活动性顺序：K Ca Na Mg Al Zn Fe Sn Pb (H) Cu Hg Ag Pt Au。位于前面的金属能把位于后面的金属从它们化合物的溶液里置换出来（课本外补充：钾、钙、钠太活泼，放进盐溶液会先和水反应，所以不用它们来置换）：${E('Fe + CuSO4','FeSO4 + Cu')}（铁表面有${M('红色物质')}，溶液由${M('蓝色变浅绿色')}）；${E('Cu + 2AgNO3','Cu(NO3)2 + 2Ag')}。比较三种金属：常用“两金夹一盐”或“两盐夹一金”。`}),
"u8-k6":Object.assign({"u": 8, "name": "置换反应", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "置换反应 单质 化合物", "short": "置换反应"},{core:`由一种单质与一种化合物反应，生成另一种单质和另一种化合物的反应叫做置换反应，如金属与酸、金属与盐溶液的反应，碳还原氧化铜。一氧化碳还原氧化铁（反应物中没有单质）不是置换反应。`}),
"u8-k7":Object.assign({"u": 8, "name": "滤渣、滤液成分分析", "diff": "难", "tags": ["method"], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "滤渣 滤液 优先反应 过量", "short": "滤渣与滤液"},{core:`一种金属放入几种盐的混合溶液中，先置换出活动性<b>最弱</b>的金属。滤渣中一定有最不活泼的那种金属；向滤渣中加稀盐酸有气泡，说明加入的金属（或比氢活泼的金属）有剩余。滤液中一定有加入金属生成的盐；根据溶液颜色判断是否还有铜盐、亚铁盐。`}),
"u8-k8":Object.assign({"u": 8, "name": "炼铁原理；含杂质物质的计算", "diff": "中", "tags": [], "place": false, "star": 5, "why": "★5：近 5 年有 3 年出现在第 20–25 题（2023、2024、2025）", "kw": "炼铁 一氧化碳还原氧化铁 赤铁矿 尾气处理", "short": "炼铁"},{core:`${E('Fe2O3 + 3CO','2Fe + 3CO2','高温')}。实验：先通一氧化碳排净空气，再加热（防止爆炸）；结束时先停止加热，继续通一氧化碳到冷却。现象：${M('红棕色粉末逐渐变黑，澄清石灰水变浑浊')}。尾气中有一氧化碳，要点燃或收集。工业炼铁原料：铁矿石、焦炭、石灰石、空气。计算时：纯净物质量 = 不纯物质量 × 纯度。`}),
"u8-k9":Object.assign({"u": 8, "name": "铁生锈的条件与防护", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "铁生锈 氧气 水 防锈 铁锈", "short": "铁生锈"},{core:`铁生锈是铁与<b>氧气、水</b>同时作用的结果；铁锈主要成分是氧化铁，疏松多孔，不能阻止里层的铁继续生锈。防锈：保持铁制品表面洁净干燥；涂油、刷漆、镀其他金属；制成不锈钢等合金。`}),
"u8-k10":Object.assign({"u": 8, "name": "金属资源的保护", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（1 年）", "kw": "金属资源 回收 防腐 代用品", "short": "保护金属资源"},{core:`保护金属资源的途径：防止金属腐蚀；回收利用废旧金属；有计划、合理地开采矿物；寻找金属的代用品。`}),
"u8-e1":Object.assign({"u": 8, "name": "常见金属的物理性质和化学性质", "diff": "中", "tags": ["must", "exp"], "place": true, "star": 5, "why": "★5：课标学生必做实验的核心内容；近 5 年有 5 年出现在第 20–25 题（2022、2023、2024、2025、2026）。这个知识点在新版课本中的归属课题待核对（ⓘ）", "kw": "实验活动5 金属性质 必做实验", "short": "金属的性质"},{core:`课标必做实验（实验活动名称两种写法待课本核对 ⓘ）。观察金属颜色光泽、比较硬度（刻画）、检验导电导热；比较镁、锌、铁、铜与稀盐酸反应的快慢；做铁与硫酸铜溶液、铜与硝酸银溶液的反应，得出活动性顺序。`}),
"u8-x1":Object.assign({"u": 8, "name": "垃圾的分类与回收利用", "diff": "易", "tags": ["xk", "new"], "place": false, "star": 1, "why": "跨学科实践活动：近 5 年河南卷未见设问，按规则给 ★1", "kw": "跨学科实践活动7 垃圾分类 回收", "short": "垃圾分类"},{core:`跨学科实践：调查垃圾分类标准，探究废旧金属、塑料等的回收方法和价值。相关知识：金属资源保护、合成材料与白色污染。`}),
"u9-k1":Object.assign({"u": 9, "name": "溶液的形成与特征", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（1 年）", "kw": "溶液 均一 稳定 溶质 溶剂 乳浊液", "short": "溶液的形成"},{core:`一种或几种物质分散到另一种物质里，形成均一的、稳定的<b>混合物</b>，叫做溶液。被溶解的物质叫溶质，能溶解其他物质的叫溶剂；水是最常用的溶剂（碘酒中溶剂是酒精）。植物油与水混合形成的是乳浊液，不是溶液。溶液不一定无色（如硫酸铜溶液是${M('蓝色')}）。`}),
"u9-k2":Object.assign({"u": 9, "name": "溶解时的吸热放热；乳化", "diff": "易", "tags": [], "place": true, "star": 2, "why": "★2：已确认的题目中未见，按低频处理。这个知识点在新版课本中的归属课题待核对（ⓘ）", "kw": "吸热 放热 硝酸铵 氢氧化钠 乳化 洗涤剂", "short": "吸放热与乳化"},{core:`氢氧化钠固体溶于水${M('放热')}，硝酸铵溶于水${M('吸热')}，氯化钠溶于水温度变化不明显。洗涤剂能使油污分散成细小液滴随水流走，叫乳化；汽油除油污是溶解，两者原理不同。新版归属课题待核对 ⓘ。`}),
"u9-k3":Object.assign({"u": 9, "name": "饱和溶液与不饱和溶液", "diff": "中", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "饱和溶液 不饱和溶液 转化", "short": "饱和溶液"},{core:`在一定温度下、一定量溶剂里，不能再溶解某种溶质的溶液，叫做这种溶质的饱和溶液。不饱和变饱和：增加溶质、蒸发溶剂、改变温度（多数物质降温）。饱和溶液不一定是浓溶液；一种物质的饱和溶液还能溶解其他物质（如饱和食盐水还能溶解其他杂质）。`}),
"u9-k4":Object.assign({"u": 9, "name": "溶解度与溶解度曲线", "diff": "中", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "溶解度 溶解度曲线 交点 硝酸钾 氯化钠 氢氧化钙 气体溶解度", "short": "溶解度曲线"},{core:`固体溶解度：在一定温度下，某固态物质在 100 g 溶剂里达到饱和状态时所溶解的质量（四要素：温度、100 g 溶剂、饱和、单位 g）。溶解度曲线：交点表示该温度下两物质溶解度相等；多数固体溶解度随温度升高而增大（硝酸钾明显，氯化钠变化不大），<b>氢氧化钙随温度升高而减小</b>。气体溶解度随温度升高而减小，随压强增大而增大。`}),
"u9-k5":Object.assign({"u": 9, "name": "结晶", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（1 年）", "kw": "蒸发结晶 降温结晶 海水晒盐", "short": "结晶"},{core:`溶解度受温度影响小的物质（如氯化钠）一般用<b>蒸发结晶</b>，海水晒盐就是这个原理；溶解度受温度影响大的物质（如硝酸钾）一般用<b>降温结晶</b>（冷却热饱和溶液）。`}),
"u9-k6":Object.assign({"u": 9, "name": "溶质的质量分数及计算", "diff": "中", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（4 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "溶质质量分数 稀释 饱和溶液质量分数", "short": "质量分数"},{core:`溶质的质量分数 = 溶质质量 ÷ 溶液质量 × 100%。稀释前后<b>溶质质量不变</b>。一定温度下饱和溶液的质量分数 = S ÷ (100 g + S) × 100%（S 为溶解度），例如 20 ℃ 时氯化钠的溶解度为 36 g，其饱和溶液质量分数约为 26.5%。与方程式结合计算时，代入的是溶质的质量。`}),
"u9-e1":Object.assign({"u": 9, "name": "一定溶质质量分数的氯化钠溶液的配制", "diff": "中", "tags": ["must", "exp"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容", "kw": "实验活动6 配制溶液 必做实验 误差", "short": "配制溶液"},{core:`课标必做实验。步骤：计算→称量（量取）→溶解→装瓶贴标签。仪器：托盘天平、药匙、量筒、胶头滴管、烧杯、玻璃棒（搅拌，加速溶解）。误差分析：量水时<b>仰视</b>，水偏多，质量分数<b>偏小</b>；<b>俯视</b>则偏大；称量时药品和砝码放反（用了游码），溶质偏少，偏小。`}),
"u9-e2":Object.assign({"u": 9, "name": "粗盐中难溶性杂质的去除", "diff": "中", "tags": ["must", "exp"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容", "kw": "实验活动7 粗盐提纯 溶解 过滤 蒸发 玻璃棒 产率", "short": "粗盐提纯"},{core:`课标必做实验。步骤：溶解→过滤→蒸发→计算产率。玻璃棒作用：溶解时搅拌加速溶解；过滤时引流；蒸发时搅拌，防止局部温度过高造成液滴飞溅。蒸发皿中出现<b>较多固体</b>时停止加热，用余热蒸干。产率偏低：溶解不充分、蒸发时液滴飞溅等。`}),
"u9-x1":Object.assign({"u": 9, "name": "海洋资源的综合利用与制盐", "diff": "易", "tags": ["xk", "new"], "place": false, "star": 2, "why": "跨学科实践活动：近 5 年河南卷用它作过情境或设问（具体设问记在对应知识点上），按规则给 ★2", "kw": "跨学科实践活动8 海水晒盐 海洋资源", "short": "海水制盐"},{core:`跨学科实践：了解海水中的化学资源，模拟海水晒盐，体会从海水中获得食盐的过程。相关知识：结晶、饱和溶液、过滤。`}),
"u10-k1":Object.assign({"u": 10, "name": "酸碱指示剂", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（4 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "石蕊 酚酞 变色 指示剂", "short": "酸碱指示剂"},{core:`紫色石蕊溶液遇酸性溶液变${M('红')}，遇碱性溶液变${M('蓝')}；无色酚酞溶液遇酸性溶液${M('不变色')}，遇碱性溶液变${M('红')}。指示剂只能判断溶液的酸碱性，不能测出酸碱性的强弱。`}),
"u10-k2":Object.assign({"u": 10, "name": "溶液的酸碱度：pH", "diff": "中", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "pH 酸性 碱性 中性 pH曲线 酸雨", "short": "溶液的 pH"},{core:`pH 范围通常为 0～14：pH < 7 显酸性，pH 越小酸性越强；pH = 7 显中性；pH > 7 显碱性，pH 越大碱性越强。正常雨水因溶有二氧化碳，pH 约为 5.6；pH 小于 5.6 的是酸雨。读 pH 变化曲线：看起点判断原溶液，看 pH = 7 的点判断恰好完全反应。`}),
"u10-k3":Object.assign({"u": 10, "name": "常见的酸：盐酸、硫酸", "diff": "中", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "盐酸 硫酸 浓硫酸 吸水性 挥发性 干燥剂", "short": "盐酸与硫酸"},{core:`浓盐酸有挥发性，打开瓶盖瓶口有${M('白雾')}。浓硫酸有<b>吸水性</b>（可作干燥剂，但不能干燥氨气等碱性气体）和强腐蚀性（能使纸张、木材炭化）。稀释浓硫酸：把浓硫酸沿器壁慢慢注入水中并不断搅拌。浓盐酸、浓硫酸敞口放置，溶质质量分数都会变小（原因不同）。`}),
"u10-k4":Object.assign({"u": 10, "name": "酸的化学性质", "diff": "中", "tags": ["must"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容", "kw": "酸的通性 金属氧化物 铁锈 碳酸盐 氢离子", "short": "酸的化学性质"},{core:`酸溶液中都含有 ${I('H','+')}，所以有相似的化学性质：① 使指示剂变色；② 与活泼金属反应生成氢气；③ 与金属氧化物反应：${E('Fe2O3 + 6HCl','2FeCl3 + 3H2O')}（铁锈溶解，溶液变${M('黄色')}）；④ 与碱发生中和反应；⑤ 与某些盐反应，如与碳酸盐反应放出二氧化碳，${E('H2SO4 + BaCl2','BaSO4↓ + 2HCl')}。`}),
"u10-k5":Object.assign({"u": 10, "name": "常见的碱：氢氧化钠、氢氧化钙", "diff": "中", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（4 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "氢氧化钠 烧碱 火碱 苛性钠 氢氧化钙 熟石灰 消石灰 生石灰 潮解", "short": "常见的碱"},{core:`氢氧化钠俗称${M('火碱、烧碱、苛性钠')}，易溶于水并放热，在空气中易吸水潮解，有强腐蚀性；可作某些气体的干燥剂。氢氧化钙俗称${M('熟石灰、消石灰')}，微溶于水，水溶液叫石灰水，可由生石灰制得：${E('CaO + H2O','Ca(OH)2')}；用于建筑、改良酸性土壤、配制波尔多液。`}),
"u10-k6":Object.assign({"u": 10, "name": "碱的化学性质；氢氧化钠变质的探究", "diff": "难", "tags": ["must"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容；近 5 年有 3 年出现在第 20–25 题（2023、2024、2025）", "kw": "碱的通性 氢氧化钠变质 二氧化碳 碳酸钠 氢氧根", "short": "碱的性质与变质"},{core:`碱溶液中都含有 ${I('OH','−')}：① 使指示剂变色；② 与某些非金属氧化物反应：${E('2NaOH + CO2','Na2CO3 + H2O')}（无明显现象，这也是氢氧化钠变质的原因）；③ 与酸中和；④ 与某些盐反应：${E('2NaOH + CuSO4','Cu(OH)2↓ + Na2SO4')}（${M('蓝色沉淀')}）、${E('Ca(OH)2 + Na2CO3','CaCO3↓ + 2NaOH')}。检验是否变质：加足量稀盐酸有气泡，或加氯化钙溶液有白色沉淀；判断是否完全变质：先加足量氯化钙溶液除尽碳酸钠，再滴酚酞看是否变红。`}),
"u10-k7":Object.assign({"u": 10, "name": "中和反应及其应用", "diff": "中", "tags": ["must"], "place": true, "star": 5, "why": "★5：课标学生必做实验的核心内容。这个知识点在新版课本中的归属课题待核对（ⓘ）", "kw": "中和反应 酸碱中和 胃酸 改良酸性土壤", "short": "中和反应"},{core:`酸与碱作用生成盐和水的反应叫做中和反应，如 ${E('NaOH + HCl','NaCl + H2O')}。实质是酸中的 ${I('H','+')} 与碱中的 ${I('OH','−')} 结合生成水，反应放热。在滴有酚酞的氢氧化钠溶液中滴加盐酸，红色恰好褪去时恰好完全反应。应用：熟石灰改良酸性土壤、处理酸性废水、用含氢氧化铝的药物治疗胃酸过多。生成盐和水的反应不一定是中和反应。新版归属课题待核对 ⓘ。`}),
"u10-k8":Object.assign({"u": 10, "name": "常见的盐：氯化钠、碳酸钠、碳酸氢钠、碳酸钙", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频高频（4 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "食盐 纯碱 苏打 小苏打 大理石 石灰石 侯德榜", "short": "常见的盐"},{core:`氯化钠是食盐的主要成分（调味、配制生理盐水、融雪）；碳酸钠俗称${M('纯碱、苏打')}，水溶液显碱性（玻璃、造纸、洗涤剂）；碳酸氢钠俗称${M('小苏打')}（发酵粉、治疗胃酸过多：${E('NaHCO3 + HCl','NaCl + H2O + CO2↑')}）；碳酸钙是大理石、石灰石的主要成分（建筑材料、补钙剂）。我国化学家侯德榜发明了联合制碱法。`}),
"u10-k9":Object.assign({"u": 10, "name": "盐的化学性质；复分解反应", "diff": "中", "tags": [], "place": false, "star": 5, "why": "★5：近 5 年有 3 年出现在第 20–25 题（2023、2024、2025）", "kw": "复分解反应 沉淀 气体 水 碳酸根检验 溶解性表", "short": "复分解反应"},{core:`两种化合物互相交换成分，生成另外两种化合物的反应叫做复分解反应。发生条件：生成物中有<b>沉淀、气体或水</b>。盐的化学性质：与金属、与酸、与碱、与盐反应，如 ${E('Na2CO3 + CaCl2','CaCO3↓ + 2NaCl')}。判断能否反应要查溶解性表。碳酸盐的检验：加稀盐酸，产生能使澄清石灰水变浑浊的气体。`}),
"u10-k10":Object.assign({"u": 10, "name": "反应后溶液中溶质成分的分析", "diff": "难", "tags": ["method"], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "溶质成分 过量 恰好完全反应", "short": "溶质成分分析"},{core:`反应后溶液中<b>一定有</b>生成的可溶性物质；再考虑反应物是否过量——两种反应物最多只有一种过量。检验过量的酸：滴石蕊、测 pH、加活泼金属或碳酸盐看是否有气泡；检验过量的碱：滴酚酞（注意碳酸钠溶液也显碱性）。不溶物（如碳酸钙）不是溶质。`}),
"u10-k11":Object.assign({"u": 10, "name": "化学肥料", "diff": "易", "tags": [], "place": true, "star": 4, "why": "★4：考频高频（4 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题。这个知识点在新版课本中的归属课题待核对（ⓘ）", "kw": "氮肥 磷肥 钾肥 复合肥 铵态氮肥 尿素", "short": "化学肥料"},{core:`氮肥（如尿素 ${F('CO(NH2)2')}、${F('NH4HCO3')}）使叶色浓绿；磷肥（如 ${F('Ca(H2PO4)2')}）增强抗寒抗旱能力；钾肥（如 ${F('K2SO4')}）增强抗病虫害和抗倒伏能力。同时含两种或两种以上营养元素的是复合肥，如 ${F('KNO3')}、${F('NH4H2PO4')}。铵态氮肥不能与熟石灰等碱性物质混用（会放出氨气，降低肥效）；与熟石灰研磨有刺激性气味，可用来鉴别。新版并入课题 3 ⓘ。`}),
"u10-k12":Object.assign({"u": 10, "name": "粗盐中可溶性杂质的去除", "diff": "难", "tags": ["outside", "method"], "place": false, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "粗盐 可溶性杂质 氯化钡 碳酸钠 氢氧化钠 加试剂顺序", "short": "粗盐可溶性杂质"},{core:`课本外 · 河南卷考过（2022-25(4)、2023-24、2024-18）。粗盐水中的 ${F('CaCl2')}、${F('MgCl2')}、${F('Na2SO4')}，依次加入过量的 ${F('BaCl2')}、NaOH、${F('Na2CO3')} 溶液（<b>碳酸钠必须在氯化钡之后</b>，用来除去钙离子和过量的钡离子），过滤后加适量稀盐酸除去过量的 NaOH 和 ${F('Na2CO3')}，再蒸发结晶。如 ${E('Na2SO4 + BaCl2','BaSO4↓ + 2NaCl')}，${E('MgCl2 + 2NaOH','Mg(OH)2↓ + 2NaCl')}，${E('BaCl2 + Na2CO3','BaCO3↓ + 2NaCl')}。高中必修第二册实验活动 4 再系统学。`}),
"u10-k13":Object.assign({"u": 10, "name": "物质的检验、鉴别与推断题突破口", "diff": "难", "tags": ["method"], "place": false, "star": 5, "why": "★5：近 5 年有 3 年出现在第 20–25 题（2022、2024、2025）", "kw": "推断题 突破口 颜色 俗名 特征反应 鉴别", "short": "推断突破口"},{core:`推断题从“突破口”入手：<b>颜色</b>（如氧化铁${M('红棕色')}，氧化铜、四氧化三铁${M('黑色')}，硫酸铜溶液${M('蓝色')}，氯化铁溶液${M('黄色')}，氯化亚铁溶液${M('浅绿色')}，氢氧化铜${M('蓝色沉淀')}）、<b>特征反应</b>（使澄清石灰水变浑浊、使带火星木条复燃）、<b>俗名与用途</b>（灭火的是二氧化碳，改良酸性土壤的是熟石灰）。鉴别要选现象各不相同的方法。`}),
"u10-e1":Object.assign({"u": 10, "name": "常见酸、碱的化学性质", "diff": "中", "tags": ["must", "exp"], "place": false, "star": 5, "why": "★5：课标学生必做实验的核心内容", "kw": "实验活动8 酸碱化学性质 必做实验", "short": "酸碱化学性质"},{core:`课标必做实验。分别用稀盐酸、稀硫酸做与指示剂、镁或锌、生锈铁钉、碳酸钠的反应；用氢氧化钠、氢氧化钙溶液做与指示剂、硫酸铜溶液、二氧化碳的反应；用酚酞指示氢氧化钠与盐酸的中和。记录现象，写出方程式，归纳酸、碱各自的相似性质。`}),
"u10-x1":Object.assign({"u": 10, "name": "探究土壤酸碱性对植物生长的影响", "diff": "易", "tags": ["xk", "new"], "place": false, "star": 2, "why": "跨学科实践活动：近 5 年河南卷用它作过情境或设问（具体设问记在对应知识点上），按规则给 ★2", "kw": "跨学科实践活动9 土壤酸碱性 改良", "short": "土壤酸碱性"},{core:`跨学科实践：测定土壤浸出液的 pH，了解不同植物适宜的酸碱性范围，探讨用熟石灰改良酸性土壤。相关知识：pH、指示剂、中和反应。`}),
"u11-k1":Object.assign({"u": 11, "name": "人体所需的营养素及食物来源", "diff": "易", "tags": [], "place": false, "star": 4, "why": "★4：考频必考（5 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题", "kw": "蛋白质 糖类 油脂 维生素 无机盐 营养素", "short": "营养素"},{core:`六大营养素：蛋白质、糖类、油脂、维生素、无机盐和水。蛋白质主要来自肉、蛋、奶、豆类；糖类（如淀粉）主要来自米、面，是人体主要的供能物质；维生素主要来自蔬菜、水果。`}),
"u11-k2":Object.assign({"u": 11, "name": "化学元素与人体健康", "diff": "易", "tags": [], "place": false, "star": 3, "why": "★3：考频中频（2 年）", "kw": "常量元素 微量元素 钙 铁 锌 碘 贫血", "short": "元素与健康"},{core:`人体中含量超过 0.01% 的是常量元素（如钙），低于的是微量元素（如铁、锌、硒、碘、氟）。缺钙易患骨质疏松（老人）、佝偻病（幼儿）；缺铁会引起贫血；缺碘会引起甲状腺肿大；缺锌会影响生长发育。微量元素也不是越多越好。`}),
"u11-k3":Object.assign({"u": 11, "name": "远离有害物质", "diff": "易", "tags": [], "place": true, "star": 2, "why": "★2：已确认的题目中未见，按低频处理。这个知识点在新版课本中的归属课题待核对（ⓘ）", "kw": "一氧化碳中毒 甲醛 霉变 亚硝酸钠", "short": "有害物质"},{core:`一氧化碳能与血红蛋白结合使人中毒；甲醛会破坏蛋白质结构，不能用来浸泡食品；霉变的食物含黄曲霉毒素，不能食用；亚硝酸钠有毒，不能当食盐用。新版是否单独讲、放在哪里待核对 ⓘ。`}),
"u11-k4":Object.assign({"u": 11, "name": "材料的分类：金属材料、合成材料、复合材料", "diff": "易", "tags": [], "place": true, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题。这个知识点在新版课本中的归属课题待核对（ⓘ）", "kw": "合成材料 塑料 合成纤维 合成橡胶 复合材料 天然材料 白色污染", "short": "材料分类"},{core:`金属材料包括纯金属和合金；塑料、合成纤维、合成橡胶是三大合成材料（属于有机合成材料）；玻璃钢、碳纤维复合材料等是复合材料；棉花、羊毛、蚕丝、天然橡胶是天然材料；陶瓷、玻璃、水泥是无机非金属材料。废弃塑料造成“白色污染”。新版归属课题待核对 ⓘ。`}),
"u11-k5":Object.assign({"u": 11, "name": "纤维的鉴别", "diff": "易", "tags": [], "place": true, "star": 3, "why": "★3：考频中频（2 年）。这个知识点在新版课本中的归属课题待核对（ⓘ）", "kw": "羊毛 涤纶 灼烧 烧焦羽毛气味", "short": "纤维鉴别"},{core:`灼烧闻气味：羊毛、蚕丝（含蛋白质）有${M('烧焦羽毛的气味')}；棉花有烧纸的气味；合成纤维（如涤纶）有特殊气味，灰烬呈黑色硬块。新版归属课题待核对 ⓘ。`}),
"u11-k6":Object.assign({"u": 11, "name": "环境保护与可持续发展", "diff": "易", "tags": [], "place": true, "star": 4, "why": "★4：考频高频（3 年），但在第 20–25 题出现不足 3 年，主要在选择、填空题。这个知识点在新版课本中的归属课题待核对（ⓘ）", "kw": "环境保护 绿色化学 可持续发展 垃圾分类", "short": "环保与发展"},{core:`化学在资源、能源、材料、环境、健康等方面促进社会可持续发展。保护环境：使用清洁能源、减少污染物排放、垃圾分类回收、合理使用化肥农药、禁止滥伐林木；绿色化学提倡从源头上减少或消除污染。`}),
"u11-x1":Object.assign({"u": 11, "name": "调查我国航天科技领域中新型材料、新型能源的应用", "diff": "易", "tags": ["xk", "new"], "place": false, "star": 1, "why": "跨学科实践活动：只有估计的题目，按规则给 ★1", "kw": "跨学科实践活动10 航天 新材料 新能源", "short": "航天新材料"},{core:`跨学科实践：调查火箭推进剂（如液氢液氧）、航天器使用的合金和复合材料等，体会化学对科技发展的贡献。相关知识：新能源、材料的分类。`}),

<script>
window.BRIDGE=[{"u": 1, "fix": false, "junior": "化学变化的本质是生成了其他物质；微观上是分子分成原子、原子重新组合。", "senior": "从化学键的角度看，化学变化是旧化学键断裂、新化学键形成的过程。", "ref": "必修第一册 第四章 第三节 化学键", "now": "知道“化学键”这个词以后会学即可。中招按初中说法答题。", "id": "u1-b1", "level": "了解"}, {"u": 2, "fix": true, "junior": "氧化反应是物质与氧发生的反应。", "senior": "用元素化合价的升降（本质是电子转移）来定义氧化还原反应，没有氧参加的反应也可以是氧化还原反应。", "ref": "必修第一册 第一章 第三节 氧化还原反应", "now": "了解即可。中招判断“氧化反应”仍按“物质与氧发生的反应”。", "id": "u2-b1", "level": "了解"}, {"u": 2, "fix": false, "junior": "催化剂能改变化学反应速率，本身的质量和化学性质不变。", "senior": "系统研究影响化学反应速率的因素（浓度、温度、催化剂等）和化学反应的限度。", "ref": "必修第二册 第六章 第二节 化学反应的速率与限度", "now": "了解即可。", "id": "u2-b2", "level": "了解"}, {"u": 2, "fix": false, "junior": "二氧化硫、二氧化氮是空气污染物，会形成酸雨。", "senior": "学习硫、氮及其化合物的性质和相互转化，认识酸雨形成的具体反应。", "ref": "必修第二册 第五章 第一、二节", "now": "了解即可。", "id": "u2-b3", "level": "了解"}, {"u": 3, "fix": true, "junior": "同种元素的原子质子数相同。", "senior": "质子数相同、中子数不同的原子互为同位素，如氢有三种核素；元素是同一类核素的总称。", "ref": "必修第一册 第四章 第一节 原子结构与元素周期表", "now": "知道“同种元素的原子中子数可以不同”即可。", "id": "u3-b1", "level": "了解"}, {"u": 3, "fix": false, "junior": "原子结构示意图；元素周期表一格的信息。", "senior": "按核外电子排布理解元素周期表的周期和族，学习元素性质的周期性变化（元素周期律）。", "ref": "必修第一册 第四章 第一、二节", "now": "了解即可。", "id": "u3-b2", "level": "了解"}, {"u": 3, "fix": false, "junior": "物质由分子、原子或离子构成。", "senior": "学习离子键、共价键，解释这些粒子是怎样结合在一起的。", "ref": "必修第一册 第四章 第三节 化学键", "now": "了解即可。", "id": "u3-b3", "level": "了解"}, {"u": 4, "fix": false, "junior": "化合价：化合物中正负化合价代数和为零。", "senior": "化合价的升降是判断氧化还原反应的依据。", "ref": "必修第一册 第一章 第三节", "now": "了解即可。", "id": "u4-b1", "level": "了解"}, {"u": 4, "fix": false, "junior": "相对分子质量用于化学式计算。", "senior": "引入“物质的量”和“摩尔质量”，把质量和粒子数联系起来。", "ref": "必修第一册 第二章 第三节 物质的量", "now": "只需知道名称。中招计算一律按质量算，不用这些概念。", "id": "u4-b2", "level": "了解"}, {"u": 4, "fix": false, "junior": "单质、化合物、氧化物的分类。", "senior": "学习更完整的物质分类（含分散系与胶体）和不同类别物质之间的转化。", "ref": "必修第一册 第一章 第一节 物质的分类及转化", "now": "了解即可。", "id": "u4-b3", "level": "了解"}, {"u": 5, "fix": false, "junior": "根据化学方程式按“质量”计算。", "senior": "用物质的量进行化学方程式计算，计算更简便。", "ref": "必修第一册 第三章 第二节（物质的量在化学方程式计算中的应用）", "now": "只需知道以后会换一种算法。中招按质量计算。", "id": "u5-b1", "level": "了解"}, {"u": 6, "fix": false, "junior": "一氧化碳有还原性，能把氧化铁、氧化铜中的金属还原出来。", "senior": "在氧化还原反应中，一氧化碳是还原剂。", "ref": "必修第一册 第一章 第三节", "now": "了解即可。", "id": "u6-b1", "level": "了解"}, {"u": 6, "fix": false, "junior": "二氧化碳能与氢氧化钠、氢氧化钙溶液反应。", "senior": "能与碱反应生成盐和水的氧化物叫酸性氧化物。", "ref": "必修第一册 第一章 第一节", "now": "了解即可。", "id": "u6-b2", "level": "了解"}, {"u": 6, "fix": false, "junior": "金刚石、石墨、C₆₀ 都由碳元素组成。", "senior": "由同一种元素形成的几种性质不同的单质互为同素异形体。", "ref": "必修第一册 第一章 第一节", "now": "知道这个名称即可。", "id": "u6-b3", "level": "了解"}, {"u": 7, "fix": true, "junior": "通常所说的燃烧是可燃物与氧气发生的反应。", "senior": "燃烧不一定需要氧气参加：氢气、钠都能在氯气中燃烧。", "ref": "必修第一册 第二章 第二节 氯及其化合物", "now": "了解即可。中招答燃烧条件仍写“与氧气（或空气）接触”。", "id": "u7-b1", "level": "了解"}, {"u": 7, "fix": false, "junior": "化学反应伴随能量变化，有放热和吸热。", "senior": "从化学键断裂吸收能量、形成放出能量来解释反应热；学习化学能与电能的转化。", "ref": "必修第二册 第六章 第一节 化学反应与能量变化", "now": "了解即可。", "id": "u7-b2", "level": "了解"}, {"u": 7, "fix": false, "junior": "化石燃料、甲烷燃烧。", "senior": "认识甲烷等有机化合物的结构；学习煤和石油的综合利用。", "ref": "必修第二册 第七章 第一节；第八章 第一节", "now": "了解即可。", "id": "u7-b3", "level": "了解"}, {"u": 8, "fix": true, "junior": "铁在置换反应中生成亚铁盐（+2 价）。", "senior": "学习 Fe²⁺ 与 Fe³⁺ 的相互转化；铁在氯气中燃烧生成 FeCl₃（+3 价）。", "ref": "必修第一册 第三章 第一节 铁及其化合物；FeCl₃ 的生成在第二章 第二节", "now": "了解即可。中招写铁与酸、与硫酸铜的反应一律生成亚铁盐。", "id": "u8-b1", "level": "了解"}, {"u": 8, "fix": false, "junior": "合金是金属材料；铝表面有致密的氧化膜。", "senior": "学习铝和氧化铝既能与酸反应、也能与强碱溶液反应，以及新型合金。", "ref": "必修第一册 第三章 第二节 金属材料", "now": "了解即可。", "id": "u8-b2", "level": "了解"}, {"u": 9, "fix": true, "junior": "溶液的浓度用溶质的质量分数表示，按质量计算。", "senior": "用“物质的量浓度”表示溶液浓度，并学习配制一定物质的量浓度的溶液。", "ref": "必修第一册 第二章 第三节 物质的量；实验活动1", "now": "只需知道名称。中招只用溶质质量分数。", "id": "u9-b1", "level": "了解"}, {"u": 9, "fix": false, "junior": "溶解度、饱和溶液。", "senior": "学习难溶物在水中的沉淀溶解平衡。", "ref": "选择性必修1 第三章（超出必修）", "now": "了解即可。", "id": "u9-b2", "level": "了解"}, {"u": 10, "fix": true, "junior": "复分解反应发生的条件：生成沉淀、气体或水。", "senior": "用离子反应解释复分解反应：溶液中某些离子结合使离子浓度减小，并用离子方程式表示。", "ref": "必修第一册 第一章 第二节 离子反应", "now": "了解即可。中招写化学方程式，不写离子方程式。", "id": "u10-b1", "level": "了解"}, {"u": 10, "fix": false, "junior": "酸溶液中都有 H⁺，碱溶液中都有 OH⁻。", "senior": "从电离的角度定义酸和碱。", "ref": "必修第一册 第一章 第二节", "now": "了解即可。", "id": "u10-b2", "level": "了解"}, {"u": 10, "fix": false, "junior": "碳酸钠、碳酸氢钠的性质与用途。", "senior": "系统比较碳酸钠和碳酸氢钠的性质，学习钠及其化合物。", "ref": "必修第一册 第二章 第一节 钠及其化合物", "now": "了解即可。", "id": "u10-b3", "level": "了解"}, {"u": 10, "fix": false, "junior": "pH 表示溶液的酸碱度。", "senior": "学习水的电离和溶液 pH 的计算。", "ref": "选择性必修1 第三章 第二节（超出必修）", "now": "了解即可。", "id": "u10-b4", "level": "了解"}, {"u": 11, "fix": false, "junior": "六大营养素。", "senior": "学习糖类、油脂、蛋白质的组成和性质。", "ref": "必修第二册 第七章 第四节 基本营养物质", "now": "了解即可。", "id": "u11-b1", "level": "了解"}, {"u": 11, "fix": false, "junior": "塑料、合成纤维、合成橡胶是合成材料。", "senior": "从乙烯等认识有机高分子材料是怎样合成的。", "ref": "必修第二册 第七章 第二节 乙烯与有机高分子材料", "now": "了解即可。", "id": "u11-b2", "level": "了解"}, {"u": 11, "fix": false, "junior": "化学与可持续发展。", "senior": "学习自然资源的开发利用、化学品的合理使用、环境保护与绿色化学。", "ref": "必修第二册 第八章 化学与可持续发展", "now": "了解即可。", "id": "u11-b3", "level": "了解"}];

<script>
(function(){

let status=store.get('hxzs.status',{}); if(!status||typeof status!=='object') status={};

const tint=(hex,a)=>{const n=parseInt(hex.slice(1),16),m=x=>Math.round(255-(255-x)*a);return `rgb(${m(n>>16)},${m(n>>8&255)},${m(n&255)})`;};

/* ---------- 侧栏 ---------- */

      h+=`<a class="pt" href="#${id}" style="--tc:${TIER_C[e.tier]}"><span class="pt-top"><span class="pt-no">${no}</span><span class="pt-st"><svg viewBox="0 0 16 16" aria-hidden="true"><g data-pie="${id}" data-cx="8" data-cy="8" data-r="6.5"></g></svg><span data-st-tile="${id}"></span></span></span><b>${esc(k.short)}</b><span class="pt-meta">★${k.star} · ${e.tier} ${e.count.replace(/\s/g,'')}</span><i></i></a>`;});});
  return h+'</div></details>';

/* ---------- 化学式原子计数（原子账本） ---------- */
function parseF(str){let i=0;const s=str;function grp(){const c={};while(i<s.length){if(s[i]==='('){i++;const sub=grp();const mm=/^\d+/.exec(s.slice(i));const k=mm?+mm[0]:1;i+=mm?mm[0].length:0;for(const x in sub)c[x]=(c[x]||0)+sub[x]*k;}else if(s[i]===')'){i++;return c;}else{const mm=/^([A-Z][a-z]?)(\d*)/.exec(s.slice(i));if(!mm){i++;continue;}c[mm[1]]=(c[mm[1]]||0)+(+(mm[2]||1));i+=mm[0].length;}}return c;}return grp();}
function sideCount(side){const tot={};side.replace(/[↑↓]/g,'').split(' + ').forEach(t=>{const mm=/^(\d*)(.*)$/.exec(t.trim()),k=+(mm[1]||1),c=parseF(mm[2]);for(const x in c)tot[x]=(tot[x]||0)+k*c[x];});return tot;}
function ledgerHTML(l,r){const a=sideCount(l),b=sideCount(r),els=[...new Set((l.replace(/[↑↓]/g,'').match(/[A-Z][a-z]?/g)||[]))];
  const ok=els.every(x=>a[x]===b[x])&&Object.keys(b).every(x=>x in a);
  return `<table class="ledger" data-ok="${ok}"><caption>原子账本：反应前后各种原子个数</caption><tr><th></th>${els.map(x=>`<th>${x}</th>`).join('')}</tr><tr><td>前</td>${els.map(x=>`<td>${a[x]}</td>`).join('')}</tr><tr><td>后</td>${els.map(x=>`<td>${b[x]||0}</td>`).join('')}</tr><tr><td colspan="${els.length+1}" class="${ok?'ok':'no'}">${ok?'✓ 每种原子个数都相等':'✗ 不相等'}</td></tr></table>`;}
/* ---------- 增强部件 ---------- */
const chipHTML=c=>`<span class="chip ${c[0]}${c[1]==='clear'?' clear':''}" style="--c:${c[1]||'#fff'}" aria-hidden="true"></span>`;

function neutralSVG(){

  const hp=(x,y,tx,ty)=>`<g transform="translate(${x} ${y})"><g class="mv" style="--tx:${tx}px;--ty:${ty}px"><circle cx="0" cy="0" r="8" fill="#fff" stroke="#475569"/><text x="0" y="3.5" text-anchor="middle" class="il dk sm">H</text><text x="0" y="-13" text-anchor="middle" class="tag hpt">H⁺</text></g></g>`;
  return `<svg viewBox="0 0 300 168" class="micro-svg" role="img" aria-label="氢氧化钠溶液与盐酸反应的粒子示意：H⁺ 与 OH⁻ 结合成水，Na⁺ 和 Cl⁻ 留在溶液中">
  <rect x="6" y="14" width="288" height="148" rx="10" fill="#f6fbff" stroke="#9aa9b8"/>
  ${ion(44,128,13,'#a8b3c4','Na⁺')}${ion(246,134,13,'#a8b3c4','Na⁺')}${ion(140,136,15,'#9bd17f','Cl⁻')}${ion(262,58,15,'#9bd17f','Cl⁻')}
  ${pair(70,62)}${pair(180,92)}${hp(136,44,-83,10)}${hp(228,100,-65,-16)}
  <g class="h2o-lab"><text x="70" y="100" text-anchor="middle" class="tag w">H₂O</text><text x="180" y="130" text-anchor="middle" class="tag w">H₂O</text></g></svg>`;

function layoutMap(kids,o){
  const all=[];
  ['R','L'].forEach(sd=>{
    const top=kids.filter(n=>n.side===sd);if(!top.length)return;

    const place=(n,d,first)=>{
      n.d=d;n.side=sd;all.push(n);mine.push(n);
      if(!first) cur+=o.gap[d]||0;
      const ch=n.children||[];
      if(!ch.length){n.cy=cur+n.h/2;cur+=n.h;return;}
      const start=cur,from=mine.length;
      ch.forEach((c,i)=>place(c,d+1,i===0));
      const span=cur-start;
      if(span<n.h){const sh=(n.h-span)/2;mine.slice(from).forEach(m=>m.cy+=sh);cur=start+n.h;}
      n.cy=(ch[0].cy+ch[ch.length-1].cy)/2;
    };
    top.forEach((n,i)=>place(n,1,i===0));
    mine.forEach(n=>n.cy-=cur/2);
    const maxW=[];mine.forEach(n=>maxW[n.d]=Math.max(maxW[n.d]||0,n.w));
    let e=o.half;const inner=[];
    for(let d=1;d<maxW.length;d++){e+=o.col[d];inner[d]=e;e+=maxW[d];}

      if(sd==='R'){n.left=x;n.inX=x;n.outX=x+n.w;}else{n.left=-x-n.w;n.inX=-x;n.outX=-x-n.w;}});

    const btn=wrap.querySelector('[data-act="full"]');if(btn){btn.textContent=on?'退出全屏':'全屏';btn.focus({preventScroll:true});}
    if(!on)M.fit();};
  wrap.querySelector('.mm-tools').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act;
    if(a==='in')M.zoom(1.5);else if(a==='out')M.zoom(1/1.5);else if(a==='fit')M.fit();
    else if(a==='full')M.full(!wrap.classList.contains('mm-full'));else if(a==='png')exportPNG(opt.svg,opt.fname);});
  const pt=(x,y,inv)=>{const p=M.svg().createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(inv);};
  let drag=null,moved=false,swallow=false;
  stage.addEventListener('pointerdown',e=>{if(e.button!==0||!wrap.classList.contains('zoomed'))return;
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,inv:M.svg().getScreenCTM().inverse(),vb:M.vb.slice()};moved=false;});
  stage.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;
    if(!moved){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5)return;moved=true;stage.setPointerCapture(e.pointerId);wrap.classList.add('dragging');}
    const p0=pt(drag.x,drag.y,drag.inv),p1=pt(e.clientX,e.clientY,drag.inv);
    M.vb[0]=drag.vb[0]-(p1.x-p0.x);M.vb[1]=drag.vb[1]-(p1.y-p0.y);clamp();set();});
  const end=()=>{if(!drag)return;if(moved){swallow=true;setTimeout(()=>{swallow=false;},80);wrap.classList.remove('dragging');}drag=null;};
  stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
  stage.addEventListener('click',e=>{if(swallow){e.preventDefault();e.stopPropagation();swallow=false;}},true);
  stage.addEventListener('click',e=>{const bn=e.target.closest('.mm-node[data-bb]');if(bn)M.zoomTo(bn.dataset.bb.split(' ').map(Number));});
  stage.addEventListener('wheel',e=>{if(!wrap.classList.contains('mm-full')&&!e.ctrlKey)return;e.preventDefault();
    const p=pt(e.clientX,e.clientY,M.svg().getScreenCTM().inverse());M.zoom(e.deltaY<0?1.25:1/1.25,p.x,p.y);},{passive:false});
  MAPS.push(M);M.render();
  return M;
}

function fillOptions(){
  const opts=names.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');
  $$('select[data-id]').forEach(sel=>{sel.innerHTML=opts;});
  $$('select[data-batch]').forEach(sel=>{const first=sel.options[0].text;sel.innerHTML=`<option value="">${esc(first)}</option>`+opts;});
  const f=$('#fStatus'),keep=f.value;f.innerHTML='<option value="">全部</option>'+opts;f.value=keep;
}
function syncStatus(){
  $$('select[data-id]').forEach(sel=>{sel.value=String(stOf(sel.dataset.id));});
  $$('.st[data-st-for]').forEach(b=>{const s=stOf(b.dataset.stFor);b.dataset.s=s;b.textContent=names[s];});
  $$('[data-st-tile]').forEach(b=>{b.textContent=names[stOf(b.dataset.stTile)];});
  paintPies();
  const cnt=[0,0,0,0];ALL_KPS.forEach(id=>cnt[stOf(id)]++);
  $('#progress').textContent=[3,2,1,0].map(i=>`${names[i]} ${cnt[i]}`).join('，')+`（共 ${ALL_KPS.length}）`+(store.ok?'':'。此浏览器不能保存进度，请用「导出进度」');
  window.BOOK.forEach(u=>{
    const ids=UNIT_KPS[u.no],c=[0,0,0,0];ids.forEach(id=>c[stOf(id)]++);
    const bar=document.querySelector(`[data-ubar="${u.no}"]`);
    if(bar) bar.innerHTML=[3,2,1].map(i=>`<i style="width:${c[i]/ids.length*100}%;background:${RING_C[i]}"></i>`).join('');
    const t=document.querySelector(`[data-utext="${u.no}"]`);if(t)t.textContent=`${names[3]} ${c[3]} / ${ids.length}`;
    const n=document.querySelector(`[data-ucnt="${u.no}"]`);if(n)n.textContent=`${c[3]}/${ids.length}`;
  });
}
function applyFilters(){
  const q=NORM($('#q').value.trim()),fu=$('#fUnit').value,fs=+$('#fStar').value,ft=$('#fTier').value,fd=$('#fDiff').value,fst=$('#fStatus').value,fg=$('#fTag').value;
  let shown=0;
  $$('.kp').forEach(el=>{
    let ok=true;
    if(fu&&el.dataset.u!==fu) ok=false;
    if(fs&&+el.dataset.star<fs) ok=false;
    if(ft&&el.dataset.tier!==ft) ok=false;
    if(fd&&el.dataset.diff!==fd) ok=false;
    if(fg&&!el.dataset.tags.split(' ').includes(fg)) ok=false;
    if(fst!==''&&String(stOf(el.id))!==fst) ok=false;
    if(q&&!NORM(el.textContent+' '+el.dataset.kw).includes(q)) ok=false;
    el.hidden=!ok;if(ok)shown++;
  });
  $$('.sec-h').forEach(h=>{h.hidden=h.dataset.kps.split(',').every(id=>document.getElementById(id).hidden);});
  $$('.unit').forEach(s=>{s.hidden=Array.from(s.querySelectorAll('.kp')).every(k=>k.hidden);});
  const nOn=[q,fu,fs,ft,fd,fst!=='',fg].filter(Boolean).length;
  $('#filtBtn').textContent='筛选与进度'+(nOn?`（${nOn}）`:'');
  $('#noCards').style.display=shown?'none':'block';
}
function resetFilters(){$('#q').value='';$('#fStar').value='0';['#fUnit','#fTier','#fDiff','#fStatus','#fTag'].forEach(s=>{$(s).value='';});applyFilters();}

  /* 跳转：清掉挡住目标的筛选，展开折叠，闪一下 */
  document.addEventListener('click',e=>{
    const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a||a.hasAttribute('data-open-guide'))return;
    const id=decodeURIComponent((a.getAttribute('href')||'').slice(1)),t=id&&document.getElementById(id);if(!t)return;
    if(t.hidden||(t.closest('.unit')&&t.closest('.unit').hidden)) resetFilters();
    for(let p=t;p;p=p.parentElement) if(p.tagName==='DETAILS') p.open=true;
    MAPS.forEach(m=>m.full(false));setToc(false);setFilt(false);
    t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash');setTimeout(()=>t.classList.remove('flash'),2000);
  });
  /* 自测：点遮挡处显示/隐藏 */
  document.addEventListener('click',e=>{if(!document.body.classList.contains('selftest'))return;const m=e.target.closest&&e.target.closest('.mask');if(m){m.classList.toggle('shown');}});
  if(!window.matchMedia('(max-width:760px)').matches) $$('details.ptable-wrap').forEach(d=>d.open=true);
  $$('.tool-net').forEach(sec=>pickNet(sec,window.UNITX[sec.dataset.unit].net.start));
  $('#main').addEventListener('click',e=>{
    const p=e.target.closest('.play');
    if(p){const svg=p.closest('.tri-col').querySelector('.micro-svg'),on=!svg.classList.contains('after');svg.classList.toggle('after',on);p.setAttribute('aria-pressed',String(on));p.textContent=on?'↺ 回到反应前':'▶ 播放：H⁺ 与 OH⁻ 结合';return;}
    const nd=e.target.closest('.nd');if(nd)pickNet(nd.closest('.tool-net'),nd.dataset.n);
  });
  $('#main').addEventListener('keydown',e=>{const nd=e.target.closest&&e.target.closest('.nd');if(nd&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pickNet(nd.closest('.tool-net'),nd.dataset.n);}});
  setHS(!!store.get('hxzs.showHS',false));setST(!!store.get('hxzs.selfTest',false));
  fillOptions();syncStatus();applyFilters();
  $('#main').addEventListener('change',e=>{
    const sel=e.target.closest('select[data-id]');
    if(sel){const v=+sel.value;if(v===0)delete status[sel.dataset.id];else status[sel.dataset.id]=v;store.set('hxzs.status',status);syncStatus();applyFilters();return;}
    const b=e.target.closest('select[data-batch]');
    if(b&&b.value!==''){const v=+b.value,sc=b.dataset.batch,mm=/^u(\d+)(?:-s(\d+))?$/.exec(sc);
      const u=window.BOOK.find(x=>x.no===+mm[1]);const ids=mm[2]!=null?u.secs[+mm[2]].kps:UNIT_KPS[u.no];
      ids.forEach(id=>{if(v===0)delete status[id];else status[id]=v;});store.set('hxzs.status',status);b.value='';syncStatus();applyFilters();}
  });
  ['#q','#fUnit','#fStar','#fTier','#fDiff','#fStatus','#fTag'].forEach(s=>$(s).addEventListener('input',applyFilters));
  /* 改状态名称 */
  const dlg=$('#namesDlg'),form=$('#namesForm');
  const fillForm=arr=>arr.forEach((n,i)=>{form.elements['n'+i].value=n;});
  $('#namesBtn').addEventListener('click',()=>{fillForm(names);if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');});
  $('#namesReset').addEventListener('click',()=>fillForm(DEFAULT_NAMES));
  dlg.addEventListener('close',()=>{if(dlg.returnValue!=='save')return;const arr=[0,1,2,3].map(i=>form.elements['n'+i].value.trim());if(arr.some(n=>!n))return;
    names=arr;store.set('hxzs.statusNames',names);fillOptions();MAPS.forEach(m=>m.render());syncStatus();applyFilters();});
  $('#hsToggle').addEventListener('change',e=>setHS(e.target.checked));
  $('#stToggle').addEventListener('change',e=>setST(e.target.checked));
  /* 导出、导入：文件里写 app 名称，导入时检查，防止和物理进度混用 */
  $('#exportBtn').addEventListener('click',()=>{
    download(new Blob([JSON.stringify({app:APP,version:1,exported:new Date().toISOString(),status,names},null,2)],{type:'application/json'}),'化学进度.json');});
  $('#importBtn').addEventListener('click',()=>$('#importFile').click());
  $('#importFile').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
        if(!d||d.app!==APP){$('#progress').textContent=d&&d.app?`导入失败：这是「${d.app}」的进度文件，不是化学的`:'导入失败：请选择用「导出进度」保存的「化学进度.json」';return;}
        if(!d.status||typeof d.status!=='object')throw 0;
        Object.keys(d.status).forEach(id=>{const v=+d.status[id];if(window.KP[id]&&v>=1&&v<=3)status[id]=v;});
        if(Array.isArray(d.names)&&d.names.length===4&&d.names.every(n=>typeof n==='string'&&n.trim())){names=d.names;store.set('hxzs.statusNames',names);fillOptions();MAPS.forEach(m=>m.render());}
        store.set('hxzs.status',status);syncStatus();applyFilters();$('#progress').textContent+='　已导入';}
      catch(err){$('#progress').textContent='导入失败：文件内容不对';}};
    r.readAsText(f,'utf-8');e.target.value='';
  });
  /* 打印：展开折叠，打印完恢复 */
  let closed=[],printSwap=false;
  window.addEventListener('beforeprint',()=>{MAPS.forEach(m=>{m.full(false);m.fit();});if(gd.open)gd.close();
    if(depth===3){printSwap=true;depth=2;atlasM.render();depth=3;}
    closed=$$('details:not([open])');closed.forEach(d=>d.open=true);});
  window.addEventListener('afterprint',()=>{if(printSwap){printSwap=false;atlasM.render();}closed.forEach(d=>d.open=false);closed=[];});
}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
<script src="../shared/mistakes.js" data-subject="chemistry"></script>
</body>
